<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>健康证 - DIY15</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root { --card-w: 600px; --card-h: 378px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f0f4f8; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
.card-wrapper { width: 100%; max-width: var(--card-w); margin: 0 auto 20px; overflow: hidden; }
.card-scaler { width: var(--card-w); height: var(--card-h); transform-origin: top left; }
.card { width: var(--card-w); height: var(--card-h); background: linear-gradient(135deg, #fefefe 0%, #f8f9fa 100%); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.18); overflow: hidden; display: flex; flex-direction: column; position: relative; border: 2px solid #d0d5dd; }
.top-bar { height: 8px; background: linear-gradient(90deg, #1a3a6b 0%, #2a5caa 40%, #1a3a6b 100%); }
.content { flex: 1; display: flex; padding: 16px 20px 10px; gap: 18px; }
.photo-col { width: 120px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.photo-box { width: 110px; height: 140px; background: #dc3545; border-radius: 6px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.photo-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
.photo-box .avatar-placeholder { width: 70px; height: 90px; background: rgba(255,255,255,0.2); border-radius: 40% 40% 38% 38% / 50% 50% 42% 42%; position: relative; }
.photo-box .avatar-placeholder::before { content: ""; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 24px; height: 22px; background: rgba(255,255,255,0.2); border-radius: 50%; }
.photo-box .avatar-placeholder::after { content: ""; position: absolute; top: 38px; left: 50%; transform: translateX(-50%); width: 36px; height: 36px; background: rgba(255,255,255,0.15); border-radius: 50%; border-top-left-radius: 42%; border-top-right-radius: 42%; }
.photo-label { font-size: 11px; color: #888; text-align: center; }
.info-col { flex: 1; display: flex; flex-direction: column; }
.cert-title { font-size: 15px; font-weight: 700; color: #1a3a6b; text-align: center; letter-spacing: 2px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1.5px solid #e5e9f0; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 16px; flex: 1; }
.info-item { display: flex; align-items: center; font-size: 13px; line-height: 1.8; }
.info-item .label { color: #666; flex-shrink: 0; width: 60px; }
.info-item .label::after { content: "："; }
.info-item .value { color: #1a1a1a; font-weight: 500; flex: 1; border-bottom: 1px solid #e8e8e8; padding: 1px 0; min-width: 60px; }
.info-item.full { grid-column: 1 / -1; }
.info-item.full .label { width: 72px; }
.bottom-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 20px 12px; border-top: 1px solid #eef0f4; background: #fafbfc; }
.bottom-left { display: flex; flex-direction: column; gap: 1px; }
.bottom-item { display: flex; align-items: center; font-size: 12px; }
.bottom-item .label { color: #888; flex-shrink: 0; width: 60px; }
.bottom-item .label::after { content: "："; }
.bottom-item .value { color: #333; font-weight: 500; }
.qr-wrapper { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.qr-code { width: 60px; height: 60px; background: #222; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.qr-code img, .qr-code canvas { width: 100% !important; height: 100% !important; }
.qr-label { font-size: 10px; color: #aaa; }
.seal-img { position: absolute; right: 85px; bottom: 70px; width: 72px; height: auto; opacity: 0.7; transform: rotate(-12deg); pointer-events: none; z-index: 5; }
.btn-wrap { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
.btn { flex: 1; max-width: 200px; padding: 12px 0; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; background: #1a73e8; color: #fff; cursor: pointer; }
.btn:disabled { background: #ccc; }
.btn:active { opacity: 0.9; }
.toast { position: fixed; top: 20px; right: 20px; background: #27ae60; color: #fff; padding: 10px 20px; border-radius: 20px; display: none; z-index: 9999; font-size: 14px; max-width: 80%; word-break: break-all; }
.toast.error { background: #e74c3c; }
.status { text-align: center; margin-top: 10px; font-size: 14px; }
.status.success { color: #27ae60; }
.status.error { color: #e74c3c; }
.workspace { width: min(100%, 1100px); display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 600px); gap: 24px; align-items: start; text-align: left; }
.form-panel { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }
.form-panel h1 { margin: 0; font-size: 22px; color: #1f2937; }
.form-subtitle { margin-top: 5px; color: #6b7280; font-size: 12px; }
.form-heading { margin-bottom: 18px; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.field { margin-bottom: 14px; }
.field label { display: block; margin-bottom: 6px; color: #374151; font-size: 14px; font-weight: 600; }
.field input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; background: #fff; }
.field input:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.12); }
.avatar-drop { padding: 14px; border: 2px dashed #bfdbfe; border-radius: 10px; color: #6b7280; text-align: center; background: #eff6ff; cursor: pointer; transition: .2s; }
.avatar-drop.dragover { border-color: #1a73e8; color: #1d4ed8; background: #dbeafe; }
.avatar-drop input { display: none; }
.hint { margin-top: 5px; color: #6b7280; font-size: 12px; line-height: 1.5; }
.number-actions { display: flex; gap: 8px; margin-top: 8px; }
.number-actions .btn { padding: 8px 12px; font-size: 14px; }
.submit-btn { width: 100%; max-width: none; margin-top: 4px; }
.preview-panel { min-width: 0; }
@media (max-width: 760px) { .workspace { grid-template-columns: 1fr; } .preview-panel { order: -1; } .form-panel { padding: 16px; } .field-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="workspace">
<form class="form-panel" id="certForm">
  <div class="form-heading">
    <h1>健康证信息</h1>
    <div class="form-subtitle">填写信息后，右侧会同步更新预览</div>
  </div>
  <div class="field">
    <label for="avatarInput">头像</label>
    <div class="avatar-drop" id="avatarDrop">拖拽头像到这里，或点击此处选择图片<input id="avatarInput" type="file" accept="image/*"></div>
  </div>
  <div class="field-grid">
    <div class="field"><label for="orgInput">发证机构</label><input id="orgInput" type="text" value="台州市黄岩区第一人民医院" required></div>
    <div class="field"><label for="nameInput">姓名</label><input id="nameInput" type="text" value="杜天伟" required></div>
    <div class="field"><label for="idcardInput">身份证号</label><input id="idcardInput" type="text" value="622301199508018932" required></div>
    <div class="field"><label for="examTimeInput">体检日期</label><input id="examTimeInput" type="date" required></div>
    <div class="field"><label for="certIdInput">证书 ID</label><input id="certIdInput" type="text" value="8800" inputmode="numeric" required><div class="hint">用于二维码和提交请求。</div></div>
    <div class="field"><label for="numberInput">编号</label><input id="numberInput" type="text" readonly aria-readonly="true"><div class="number-actions"><button class="btn" id="randomNumberBtn" type="button">随机生成</button></div></div>
  </div>
  <div class="hint">编号格式为 JK+当前日期+6位随机数字，与证书 ID 独立。</div>
  <button class="btn submit-btn" id="generateBtn" type="submit">生成并提交</button>
</form>
<div class="preview-panel">
<div class="card-wrapper">
  <div class="card-scaler" id="cardScaler">
    <div class="card" id="card">
      <div class="top-bar"></div>
      <div class="content">
        <div class="photo-col">
          <div class="photo-box">
            <img id="avatarImg" src="./temp/1.png" alt="头像" onload="this.style.display='block';document.getElementById('avatarPlaceholder').style.display='none'" onerror="this.style.display='none';document.getElementById('avatarPlaceholder').style.display='block'">
            <div class="avatar-placeholder" id="avatarPlaceholder" style="display:none"></div>
          </div>
          <div class="photo-label">一寸免冠照片</div>
        </div>
        <div class="info-col">
          <div class="cert-title">食品从业人员健康证明</div>
          <div class="info-grid">
            <div class="info-item"><span class="label">编号</span><span class="value" id="valCode">-</span></div>
            <div class="info-item"><span class="label">姓名</span><span class="value" id="valName">杜天伟</span></div>
            <div class="info-item"><span class="label">性别</span><span class="value" id="valGender">男</span></div>
            <div class="info-item"><span class="label">年龄</span><span class="value" id="valAge">-</span></div>
            <div class="info-item full"><span class="label">身份证号</span><span class="value" id="valIdno">622301199508018932</span></div>
            <div class="info-item"><span class="label">从业类别</span><span class="value" id="valCategory">食品</span></div>
            <div class="info-item"><span class="label">体检结果</span><span class="value" style="color:#2e7d32;">合格</span></div>
          </div>
        </div>
      </div>
      <div class="bottom-bar">
        <div class="bottom-left">
          <div class="bottom-item"><span class="label">发证日期</span><span class="value" id="valIssueDate">2026-09-04</span></div>
          <div class="bottom-item"><span class="label">到期时间</span><span class="value" id="valExpire">-</span></div>
          <div class="bottom-item" style="margin-top:2px;"><span class="label">体检机构</span><span class="value" id="valOrg" style="font-size:11.5px;">台州市黄岩区第一人民医院</span></div>
        </div>
        <div class="qr-wrapper"><div class="qr-code" id="qrCode"></div><div class="qr-label">扫码验证</div></div>
      </div>
      <img class="seal-img" src="./images/DIY8.png" alt="印章" onerror="this.style.display='none'">
    </div>
  </div>
</div>
<div class="status" id="statusMessage">正在生成健康证图片...</div>
<div class="btn-wrap">
  <button class="btn" id="androidBtn" disabled>安卓下载</button>
  <button class="btn" id="iosBtn" disabled>iOS 预览</button>
</div>
</div>
 </div>
<div id="toast" class="toast"></div>
<div id="previewModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:1000;align-items:center;justify-content:center;" onclick="hideModal()">
  <img id="modalImg" style="max-width:90%;max-height:80vh;border-radius:12px;" src="" alt="预览">
</div>

<script src="js/qr-config.js"></script>
<script>
// 默认头像只用于首次加载，用户选择或拖拽新头像后会替换它。
const defaultAvatarFile = "./temp/1.png";
//diy15修改
// 二维码地址（qrUrlBase）与上传接口地址（CERT_SAVE_URL）统一在 js/qr-config.js 中配置。

// 表单的唯一数据源。卡面编号 number 与二维码使用的 certId 相互独立。
// 编号格式：JK + 当前日期（YYYYMMDD）+ 6 位随机数字。
const generateNumber = () => {
  const today = new Date();
  const date = today.getFullYear().toString() +
    String(today.getMonth() + 1).padStart(2, '0') +
    String(today.getDate()).padStart(2, '0');
  const random = Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
  return 'JK' + date + random;
};
// 体检日期默认取「当前日期前两天」，使用本地时区，格式 YYYY-MM-DD
const defaultExamTime = (() => {
    const d = new Date();
    d.setDate(d.getDate() - 2);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
})();

const formState = {
  certId: '8800',
  number: generateNumber(),
  name: '杜天伟',
  idcard: '622301199508018932',
  examTime: defaultExamTime,
  org: '台州市黄岩区第一人民医院'
};
const isIOS  = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
let savedDataUrl = '';
let previewTimer;

// 初始化卡面编号，并根据默认身份证号和日期计算初始年龄、到期时间。
document.getElementById('valCode').textContent = formState.number;

if (document.getElementById('valAge').textContent === '-' && document.getElementById('valIdno').textContent.length === 18) {
  const id = document.getElementById('valIdno').textContent;
  const y = parseInt(id.substring(6,10)), m = parseInt(id.substring(10,12))-1, d = parseInt(id.substring(12,14));
  const birth = new Date(y,m,d), today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  if (today.getMonth() < m || (today.getMonth() === m && today.getDate() < d)) age--;
  document.getElementById('valAge').textContent = age;
}
const issueDate = document.getElementById('valIssueDate').textContent;
if (issueDate) {
  const d = new Date(issueDate);
  if (!isNaN(d)) {
    d.setFullYear(d.getFullYear()+1);
    document.getElementById('valExpire').textContent = d.toISOString().split('T')[0];
  }
}

function resizeCard() {
  // 卡片保持 600px 原始尺寸导出，仅通过缩放适配小屏显示。
  const scaler = document.getElementById('cardScaler');
  const wrapper = document.querySelector('.card-wrapper');
  if (!scaler || !wrapper) return;
  const cardW = 600;
  const maxWidth = wrapper.clientWidth;
  let scale = maxWidth / cardW;
  if (scale > 1) scale = 1;
  if (scale < 0.4) scale = 0.4;
  scaler.style.transform = `scale(${scale})`;
  wrapper.style.height = (378 * scale) + 'px';
}
window.addEventListener('resize', resizeCard);

function getQrUrl() {
  // 修改证书 ID 后，二维码内容会随预览重新生成。
  return qrUrlBase + '&id=' + encodeURIComponent(formState.certId);
}

function renderQr() {
  // 先清空旧二维码，避免证书 ID 修改后新旧二维码重叠。
  const qrcodeEl = document.getElementById('qrCode');
  qrcodeEl.innerHTML = '';
  new QRCode(qrcodeEl, {
    text: getQrUrl(), width: 60, height: 60,
    colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H
  });
}

function setStatus(msg, isError = false) {
  const el = document.getElementById('statusMessage');
  el.textContent = msg;
  el.className = 'status ' + (isError ? 'error' : 'success');
}
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 4000);
}

async function exportCardImage() {
  // 导出前暂时取消页面缩放，确保生成图片使用卡片原始布局。
  const scaler = document.getElementById('cardScaler');
  const orig = scaler.style.transform;
  scaler.style.transform = 'scale(1)';
  await new Promise(r => requestAnimationFrame(r));
  try {
    const canvas = await html2canvas(document.getElementById('card'), {
      scale: 1.5,              // 进一步降低到 1.5，清晰度依然足够
      backgroundColor: '#fff',
      useCORS: true,
      allowTaint: false
    });
    // 转换为 JPEG 并降低质量，体积可减少 70%+
    return canvas.toDataURL('image/jpeg', 0.8);
  } finally {
    scaler.style.transform = orig;
  }
}

async function uploadWithTimeout(dataUrl, timeoutMs = 30000) {
  // 只有点击“生成并提交”时才上传，AbortController 用于限制请求超时时间。
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const resp = await fetch(CERT_SAVE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'cert_id=' + encodeURIComponent(formState.certId) +
        '&exam_date=' + encodeURIComponent(formState.examTime) +
        '&image_data=' + encodeURIComponent(dataUrl),
      signal: controller.signal
    });
    clearTimeout(timer);
    if (!resp.ok) throw new Error('服务器错误 ' + resp.status);
    const data = await resp.json();
    if (!data.ok) throw new Error(data.msg || '保存失败');
    return true;
  } catch (e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') throw new Error('上传超时，请检查网络或服务器配置');
    throw e;
  }
}

function syncCard() {
  // 将表单状态同步到 DIY15 卡片中的对应元素。
  document.getElementById('valCode').textContent = formState.number;
  document.getElementById('valName').textContent = formState.name;
  document.getElementById('valIdno').textContent = formState.idcard;
  document.getElementById('valIssueDate').textContent = formState.examTime;
  document.getElementById('valOrg').textContent = formState.org;
  const issueDate = new Date(formState.examTime);
  if (!Number.isNaN(issueDate.getTime())) {
    issueDate.setFullYear(issueDate.getFullYear() + 1);
    document.getElementById('valExpire').textContent = issueDate.toISOString().split('T')[0];
  }
  // 身份证号合法时自动计算年龄，否则显示占位符。
  let age = '-';
  if (/^\d{17}[\dXx]$/.test(formState.idcard)) {
    const birth = new Date(Number(formState.idcard.slice(6, 10)), Number(formState.idcard.slice(10, 12)) - 1, Number(formState.idcard.slice(12, 14)));
    const today = new Date();
    age = today.getFullYear() - birth.getFullYear();
    if (today < new Date(today.getFullYear(), birth.getMonth(), birth.getDate())) age--;
  }
  document.getElementById('valAge').textContent = age;
  renderQr();
}

async function updatePreview() {
  // 先更新卡片和二维码，再导出当前预览，下载内容始终与画面一致。
  syncCard();
  resizeCard();
  await new Promise(resolve => requestAnimationFrame(resolve));
  savedDataUrl = await exportCardImage();
  setStatus('预览已更新，点击“生成并提交”保存');
  document.getElementById('androidBtn').disabled = false;
  document.getElementById('iosBtn').disabled = false;
}

function schedulePreview() {
  // 连续输入时延迟渲染，避免每次按键都重复生成图片。
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => updatePreview().catch(error => setStatus('预览失败：' + error.message, true)), 180);
}

async function submitCertificate(event) {
  // 表单提交是服务器写入入口：校验数据、生成图片、上传并反馈结果。
  event.preventDefault();
  const form = event.currentTarget;
  if (!form.reportValidity()) return;
  const button = document.getElementById('generateBtn');
  button.disabled = true;
  try {
    await updatePreview();
    setStatus('正在保存到云端...');
    await uploadWithTimeout(savedDataUrl, 30000);
    setStatus('健康证已生成并保存成功');
    showToast('云端保存成功');
  } catch (e) {
    setStatus('生成失败：' + e.message, true);
    showToast('保存失败，请检查网络后重试', true);
  } finally {
    button.disabled = false;
  }
}

function download(dataUrl) {
  // 下载最近一次生成的图片，不再次请求服务器。
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = formState.name + '_健康证.jpg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
function preview(dataUrl) {
  // 在弹窗中查看最近一次生成的图片。
  document.getElementById('modalImg').src = dataUrl;
  document.getElementById('previewModal').style.display = 'flex';
}
function hideModal() { document.getElementById('previewModal').style.display = 'none'; }

async function loadSelectedAvatar(file) {
  // 点击选择和拖拽上传共用此函数，读取完成后触发预览更新。
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    showToast('请选择图片文件', true);
    return;
  }
  const avatar = document.getElementById('avatarImg');
  avatar.src = URL.createObjectURL(file);
  avatar.onload = () => {
    avatar.style.display = 'block';
    document.getElementById('avatarPlaceholder').style.display = 'none';
    schedulePreview();
  };
}

// 页面加载时只初始化本地预览，服务器保存由用户点击提交按钮触发。
async function init() {
  try {
    document.getElementById('certIdInput').value = formState.certId;
    document.getElementById('numberInput').value = formState.number;
    document.getElementById('orgInput').value = formState.org;
    document.getElementById('nameInput').value = formState.name;
    document.getElementById('idcardInput').value = formState.idcard;
    document.getElementById('examTimeInput').value = formState.examTime;
    await updatePreview();
  } catch (error) {
    setStatus('预览失败：' + error.message, true);
  }
}

// 绑定表单提交、随机编号和头像上传事件。
document.getElementById('certForm').addEventListener('submit', submitCertificate);
document.getElementById('randomNumberBtn').addEventListener('click', () => {
  formState.number = generateNumber();
  document.getElementById('numberInput').value = formState.number;
  schedulePreview();
});
document.getElementById('avatarInput').addEventListener('change', event => loadSelectedAvatar(event.target.files[0]));
const avatarDrop = document.getElementById('avatarDrop');
// 整个上传区域可点击，也支持拖拽文件进入。
avatarDrop.addEventListener('click', () => document.getElementById('avatarInput').click());
avatarDrop.addEventListener('dragover', event => {
  event.preventDefault();
  avatarDrop.classList.add('dragover');
});
avatarDrop.addEventListener('dragleave', () => avatarDrop.classList.remove('dragover'));
avatarDrop.addEventListener('drop', event => {
  event.preventDefault();
  avatarDrop.classList.remove('dragover');
  loadSelectedAvatar(event.dataTransfer.files[0]);
});
document.getElementById('orgInput').addEventListener('input', event => { formState.org = event.target.value; schedulePreview(); });
document.getElementById('nameInput').addEventListener('input', event => { formState.name = event.target.value; schedulePreview(); });
document.getElementById('idcardInput').addEventListener('input', event => { formState.idcard = event.target.value.trim(); schedulePreview(); });
document.getElementById('examTimeInput').addEventListener('input', event => { formState.examTime = event.target.value; schedulePreview(); });

// 证书 ID 仅允许数字；它变化时只影响二维码和提交参数，不影响卡面编号。
document.getElementById('certIdInput').addEventListener('input', event => {
  event.target.value = event.target.value.replace(/\D/g, '');
  formState.certId = event.target.value;
  schedulePreview();
});

document.getElementById('androidBtn').onclick = () => {
  if (!savedDataUrl) showToast('图片还在生成中...', true);
  else download(savedDataUrl);
};
document.getElementById('iosBtn').onclick = () => {
  if (!savedDataUrl) showToast('图片还在生成中...', true);
  else if (isIOS) preview(savedDataUrl);
  else download(savedDataUrl);
};

window.addEventListener('load', init);
</script>

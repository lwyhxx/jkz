<style>
		:root {
			--page-bg: #f3f7ff;
			--panel-bg: rgba(255, 255, 255, .9);
			--text: #172033;
			--muted: #6b7280;
			--primary: #2563eb;
			--border: #dbe3f0;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
			background: radial-gradient(circle at top left, #e4efff 0, transparent 34%), var(--page-bg);
		}

		.page {
			width: min(100% - 32px, 1080px);
			margin: 0 auto;
			padding: 36px 0 48px;
		}

		.hero {
			padding: 28px 30px;
			margin-bottom: 20px;
			border: 1px solid rgba(255, 255, 255, .9);
			border-radius: 24px;
			background: var(--panel-bg);
			box-shadow: 0 12px 34px rgba(53, 82, 130, .08);
		}

		.hero h1 { margin: 0; font-size: 27px; letter-spacing: .02em; }
		.hero p { margin: 9px 0 0; color: var(--muted); font-size: 14px; }

		.template-section {
			padding: 24px;
			border-radius: 24px;
			background: var(--panel-bg);
			box-shadow: 0 12px 34px rgba(53, 82, 130, .08);
		}

		.section-title {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin-bottom: 18px;
		}

		.section-title h2 { margin: 0; font-size: 17px; }
		.section-title span { color: var(--muted); font-size: 13px; }

		.template-grid {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 14px;
		}

		.template-card {
			display: flex;
			flex-direction: column;
			min-width: 0;
			overflow: hidden;
			border: 1px solid var(--border);
			border-radius: 11px;
			background: #fff;
			cursor: pointer;
			transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
		}

		.template-card:hover,
		.template-card:focus-visible {
			outline: none;
			transform: translateY(-3px);
			border-color: #8fb4f7;
			box-shadow: 0 9px 20px rgba(37, 99, 235, .14);
		}

		.template-card img {
			display: block;
			width: 100%;
			aspect-ratio: 1.48 / 1;
			object-fit: contain;
			padding: 9px;
			background: #f8fafc;
		}

		.template-info {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
			padding: 10px 11px 11px;
		}

		.template-name { font-size: 14px; font-weight: 600; }
		.template-open { color: var(--primary); font-size: 12px; white-space: nowrap; }

		@media (max-width: 760px) {
			.page { width: min(100% - 20px, 560px); padding-top: 18px; }
			.hero { padding: 22px 20px; }
			.template-section { padding: 16px; }
			.template-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
		}
	</style>
</head>

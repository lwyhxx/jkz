<body>
    <h1>中山模板健康证</h1>
    
    <div class="container">
        <div class="form-container">
            <h2>填写个人信息</h2>
            <div class="form-group">
                <label for="name">姓名：</label>
                <input type="text" id="name" placeholder="请输入姓名" value="">
                <!-- 新增：更新编号按钮 -->
                <button type="button" id="refreshNumBtn" class="num-refresh-btn">🔄 单独更新健康证编号</button>
            </div>
            
            <div class="form-group">
                <label for="gender">性别：</label>
                <select id="gender">
                    <option value="男" selected>男</option>
                    <option value="女">女</option>
                </select>
            </div>

            <div class="form-group">
                <label for="age">年龄：</label>
                <input type="text" id="age" placeholder="请输入年龄" value="">
            </div>
            
            <div class="form-group">
                <label for="certDate">体检日期：</label>
                <input type="date" id="certDate">
            </div>
            
            <div class="form-group">
                <label>上传照片：</label>
                <div class="upload-area" id="photoUpload">
                    <i>⚙</i>
                    <p>点击或拖动照片上传</p>
                    <input type="file" id="photoFile" accept="image/*" style="display: none;">
                </div>
                <img id="previewImage" class="upload-preview">
            </div>
            
            <button id="generateBtn" class="btn">生成健康证明</button>
        </div>
        
        <div class="preview-container">
            <h2>证明预览</h2>
            <section class="cardpic" id="certificatePreview">
                <div class="cardinfo">
                    <div class="card">
                        <div class="info">
                            <div class="bh" style="margin-top: 60px">&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;编号: <span id="previewId"></span></div>
                            <div class="bh">姓&emsp;&emsp;名: <span id="previewName"></span>&emsp;&emsp;&emsp;性&emsp;别: <span id="previewGender">男</span></div>
                            <div class="bh">体&emsp;&emsp;检: 合格&emsp;&emsp;&emsp;年&emsp;龄: <span id="previewAge"></span></div>
                            <div class="bh">工&emsp;&emsp;种: 食品/药品从业人员</div>
                            <div class="bh">有 效 期: <span id="previewDate"></span></div>
                            <div class="bh">单&emsp;&emsp;位: 中山市火炬开发区医院</div>
                        </div>
                        <img id="previewPhotoImg" src="../1/demo.jpg" class="headimg" />
                        <img src="../1/gy.png" class="ygqimg"/>
                        <img src="../1/中山.png" class="card-bg" />
                        </div>
                    </div>
                </div>
            </section>
            
            <div class="actions">
                <button id="saveImageBtn" class="btn btn-save-image">下载健康证</button>
                <button class="back-btn" onclick="history.back()">切换地区</button>
            </div>
            <div class="qr-status" id="qrStatus">二维码已初始化生成</div>
        </div>
    </div>
    
    <div id="notification" class="notification">
        <i class="fas fa-check-circle"></i>
        <span id="notificationText">操作成功！</span>
    </div>
    
    <footer>
        <p>星云工作室 &copy; 2025 | 此工具仅用于演示模拟目的，生成证明不具备法律效力，与开发者无关</p>
    </footer>
    
    <script>
        let userPhotoData = null;
        let currentHtmlContent = null;
        let certificateId = null;
        let qrCodeDataUrl = null;
        let jkzID = Date.now() + String(Math.floor(Math.random() * 100)).padStart(2, '0');
        let baseUrl = (function(){if(typeof window.QR_DOMAINS!=='undefined'&&window.QR_DOMAINS.length>0){var pd=window.QR_DOMAINS.length>1?window.QR_DOMAINS[Math.floor(Math.random()*window.QR_DOMAINS.length)]:window.QR_DOMAINS[0];var cc="abcdefghijklmnopqrstuvwxyz0123456789",rr="";for(var ii=0;ii<6;ii++)rr+=cc.charAt(Math.floor(Math.random()*cc.length));return window.location.protocol+"//"+rr+"."+pd;}if(typeof RANDOM_DOMAIN_ENABLED!=='undefined'&&!RANDOM_DOMAIN_ENABLED){return window.location.protocol+"//"+window.location.hostname;}var c="abcdefghijklmnopqrstuvwxyz0123456789",r="";for(var i=0;i<6;i++)r+=c.charAt(Math.floor(Math.random()*c.length));var h=window.location.hostname,p=h.split("."),d=(p.length>=3)?p.slice(-2).join("."):h;return window.location.protocol+"//"+r+"."+d;})();

        // 生成14位随机编号
        function generate14Num() {
            let num = '';
            for(let i=0; i<14; i++){
                num += Math.floor(Math.random()*10);
            }
            return num;
        }

        // 格式化日期：yyyy-MM-dd
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 计算 体检日期 → 次年前一天
        function getValidDate(startDateStr) {
            if (!startDateStr) return '';
            let start = new Date(startDateStr);
            let end = new Date(start);
            end.setFullYear(end.getFullYear() + 1);
            end.setDate(end.getDate() - 1);
            return formatDate(start) + ' 至 ' + formatDate(end);
        }

        document.addEventListener('DOMContentLoaded', function() {
            // 默认日期
            const today = new Date();
            let yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            const formattedDate = yesterday.toISOString().split('T')[0];
            document.getElementById('certDate').value = formattedDate;
            
            // 初始化14位编号
            certificateId = generate14Num();
            document.getElementById('previewId').textContent = certificateId;

            function showNotification(message) {
                const notification = document.getElementById('notification');
                const notificationText = document.getElementById('notificationText');
                notificationText.textContent = message;
                notification.classList.add('show');
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
            
            // 文件上传
            function setupFileUpload(uploadAreaId, fileInputId, previewImgId, callback) {
                const uploadArea = document.getElementById(uploadAreaId);
                const fileInput = document.getElementById(fileInputId);
                const previewImg = document.getElementById(previewImgId);
                
                uploadArea.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', function(e) {
                    if (this.files[0]) {
                        const reader = new FileReader();
                        reader.onload = e => {
                            previewImg.src = e.target.result;
                            previewImg.style.display = 'block';
                            callback(e.target.result);
                        }
                        reader.readAsDataURL(this.files[0]);
                    }
                });
            }
            
            setupFileUpload('photoUpload', 'photoFile', 'previewImage', dataUrl => {
                document.getElementById('previewPhotoImg').src = dataUrl;
                userPhotoData = dataUrl;
            });
            
            // 监听输入
            document.getElementById('name').addEventListener('input', updatePreview);
            document.getElementById('gender').addEventListener('change', updatePreview);
            document.getElementById('age').addEventListener('input', updatePreview);
            document.getElementById('certDate').addEventListener('input', updatePreview);

            // 更新预览
            function updatePreview() {
                document.getElementById('previewName').textContent = document.getElementById('name').value || '姓名';
                document.getElementById('previewGender').textContent = document.getElementById('gender').value;
                document.getElementById('previewAge').textContent = document.getElementById('age').value || '';
                document.getElementById('previewDate').textContent = getValidDate(document.getElementById('certDate').value);
            }

            // 单独刷新编号（新增功能）
            function refreshOnlyNumber() {
                const newNum = generate14Num();
                document.getElementById('previewId').textContent = newNum;
                certificateId = newNum;
                showNotification('编号已更新！');
            }
            // 绑定按钮点击事件
            document.getElementById('refreshNumBtn').addEventListener('click', refreshOnlyNumber);

            // 初始化就刷新一次
            updatePreview();
            
            // 二维码
            function initializeQrCode() {
                const element = document.getElementById("qrcode");
                if (!element) return;
                element.innerHTML = '';
                new QRCode(element, {
                    text: baseUrl+"/1/img/mob10/" + jkzID + ".html",
                    width: 70, 
                    height: 60,
                    colorDark: "#000",
                    colorLight: "#fff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
            initializeQrCode();

            // 生成
            document.getElementById('generateBtn').addEventListener('click', function() {
                if (!document.getElementById('name').value) {
                    showNotification('请填写姓名！');
                    return;
                }
                if(!userPhotoData){
                    showNotification('请上传头像！');
                    return;
                }
                // 生成时也刷新编号
                refreshOnlyNumber();
                updatePreview();
                showNotification('生成成功！');
            });
            
            // 下载图片
            document.getElementById('saveImageBtn').addEventListener('click', function() {
                if (!document.getElementById('name').value) {
                    showNotification('请填写姓名！');
                    return;
                }
                
                html2canvas(document.getElementById('certificatePreview'), {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#fff'
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `${document.getElementById('name').value}健康证.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showNotification('已保存到本地！');
                });
            });
        });
    </script>

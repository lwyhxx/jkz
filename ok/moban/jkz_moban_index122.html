    <meta charset="UTF-8">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1300px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin-top: 20px;
        }
        .form-container, .preview-container {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }
        h1 {
            text-align: center;
            color: white;
            margin: 20px 0;
            font-size: 2.5rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            width: 100%;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }
        .upload-area {
            border: 2px dashed #3498db;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin: 10px 0;
            background: rgba(52, 152, 219, 0.05);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .upload-area:hover {
            background: rgba(52, 152, 219, 0.1);
        }
        .upload-area i {
            font-size: 48px;
            color: #3498db;
            margin-bottom: 10px;
        }
        .upload-preview {
            max-width: 100%;
            max-height: 150px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
            border: 1px solid #ddd;
        }
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .btn-download {
            background: #27ae60;
        }
        .btn-download:hover {
            background: #219653;
        }
        .btn-save-image {
            background: #e67e22;
        }
        .btn-save-image:hover {
            background: #d35400;
        }
        .actions {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .actions button {
            flex: 1;
            min-width: 120px;
        }
        footer {
            margin-top: 30px;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            max-width: 900px;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .form-container, .preview-container {
                max-width: 100%;
            }
            .upload-container {
                flex-direction: column;
            }
        }
        .notification {
            position: fixed;
            top: 50px;
            right: 20px;
            background: #27ae60;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: translateX(150%);
            transition: transform 0.5s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .notification.show {
            transform: translateX(0);
        }
        .qr-status {
            font-size: 12px;
            color: #e74c3c;
            margin-top: 5px;
            text-align: center;
        }

        /* 证件模板样式 */
        body,html{overflow-x:hidden}
        body {margin:0;padding:0;font-size:12px;padding-bottom:40px}
        .cardinfo {display:flex;justify-content:center;margin:20px 0;font-size:14px}
        .cardinfo .card{width:350px;height:220px;position:relative}
        .card .info{width:240px;padding:0 10px;position:absolute;z-index:999}
        .card .card-bg{position:absolute;width:350px;height:220px;z-index:1;left:0;top:0;border-radius:10px}
        .card .bh{white-space:nowrap;margin-bottom:6px}
        .card .info *{font-weight:bold;font-size:12px;font-family:"仿宋"}
        .card .headimg{position:absolute;right:20px;top:60px;width:90px;height:110px;z-index:999;border-radius:5px}
        .cardinfo .ygqimg{width:100px;position:absolute;right:130px;top:calc(60% - 40px);z-index:998}
        #qrcode{width:55px;height:60px;z-index:999;border-radius:5px}
        
        /* 其他样式保留 */
        .hosp-intro, .other-intro {padding:10px}
        .hosp-intro img,.other-intro img{width:100%}
        .page-foot{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;height:50px;line-height:50px;border-top:1px solid #f2f2f2;text-align:center;background:#fff}
        .page-foot div{width:50%;border-right:1px solid #f2f2f2}
        .page-foot div:last-child{border-right:0}
        .gz{background:#5bc0de;text-align:center;padding:10px 0;line-height:25px}
        .gz a{background:#fff;display:inline-block;padding:0 15px;border-radius:15px;cursor:pointer;position:absolute;right:10px}
        .qr-container{display:flex;align-items:center;position:absolute;gap:3px;right:10px;top:155px;width:fit-content;z-index:999}
        .vertical-text{writing-mode:vertical-rl;text-orientation:upright;font-size:10px;font-family:"仿宋"}
        #saveToImg{color:red;margin-left:20px;padding:10px 0}
        .applyyj{text-align:center;background:#eba753;color:#fff;height:40px;line-height:40;border-radius:10px;width:calc(100% - 80px);margin-left:40px;margin-top:20px}
        .showCardImg{z-index:9999999;position:fixed;height:100%;width:100%;left:0;top:0;display:none}
        .showCardImgMask{z-index:9998;position:fixed;width:100%;height:100%;top:0;left:0;background:#515151;opacity:.4;display:none}
        .showCardImgimg{width:80%;margin-left:10%;margin-top:20%;background:#fff;border-radius:10px;padding-bottom:20px}
        .showCardImgimg img{width:100%}
        .closeModel{float:right;color:#007AFF;padding:0 20px}
        .refresh-id-btn{padding:6px 10px;background:#9b59b6;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;margin-left:10px;height:30px;align-self:center}
        .refresh-id-btn:hover{background:#8e44ad}
        .id-input-group{display:flex;gap:10px;align-items:center}
        .id-input-group input{flex:1}
        .back-btn{padding:10px 20px;background:#4CAF50;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:16px}
        .back-btn:hover{background:#45a049}
    </style>
<script>
var RANDOM_DOMAIN_ENABLED = true;

<body oncontextmenu="return false;">
    <h1>莆田美团</h1>
    
    <div class="container">
        <div class="form-container">
            <h2>填写个人信息</h2>
            <div class="form-group">
                <label for="name">姓名：</label>
                <input type="text" id="name" placeholder="请输入姓名" value="">
            </div>
            
            <div class="form-group">
                <label for="idNumber">编号：</label>
                <div class="id-input-group">
                    <input type="text" id="idNumber" placeholder="请输入编号" value="" readonly>
                    <button id="refreshIdBtn" class="refresh-id-btn">更新编号</button>
                </div>
            </div>
            
            <!-- 纯手动选择性别，移除自动识别 -->
            <div class="form-group">
                <label for="genderSelect">性别：</label>
                <select id="genderSelect">
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="age">年龄：</label>
                <input type="number" id="age" placeholder="请输入年龄" min="1" max:150>
            </div>
            
            <div class="form-group">
                <label for="category">工种：</label>
                <select id="category">
                    <option value="食品" selected>食品</option>
                    <option value="公共场所">公共场所</option>
                    <option value="医药销售">医药销售</option>
                    <option value="供管水">供管水</option>
                    <option value="化妆品生产">化妆品生产</option>
                    <option value="消毒产品生产">消毒产品生产</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="certDate">体检日期：</label>
                <input type="date" id="certDate">
            </div>
            
            <div class="form-group">
                <label>上传照片：</label>
                <div class="upload-area" id="photoUpload">
                    <i>⚙</i>
                    <p>点击或拖动照片上传</p>
                    <input type="file" id="photoFile" accept="image/*" style="display: none;">
                </div>
                <img id="previewImage" class="upload-preview">
            </div>
            
            <button id="generateBtn" class="btn">生成健康证明</button>
        </div>
        
        <div class="preview-container">
            <h2>证明预览</h2>
            <section class="cardpic" id="certificatePreview">
                <div class="cardinfo">
                    <div class="card">
                        <div class="info">
                            <!-- 姓名、年龄完美上下对齐 -->
                            <div class="bh" style="margin-top: 50px">证件编号: <span id="previewId"></span></div>
                            <div class="bh">类别: <span id="previewCategory"></span>&emsp;&emsp;&emsp;&emsp;姓名: <span id="previewName"></span></div>
                            <div class="bh">性别: <span id="previewGender">男</span>&emsp;&emsp;&emsp;&emsp;&emsp;年龄: <span id="previewAge"></span></div>
                            <div class="bh">发证日期: <span id="previewDate">2025年08月06日</span></div>
                            <div class="bh">有效期限: <span id="previewValidUntil">2026年08月06日</span></div>
                            <div class="bh">体检结果: <span>合格</span></div>
                            <div class="bh">检查单位: <span id="previewIssuer">莆田市城厢区中医院</span></div>
                        </div>
                        <img id="previewPhotoImg" src="../1/demo.jpg" class="headimg" />
                        <img src="../1/莆田.png" class="ygqimg"/>
                        <img src="../1/莆田1.png" class="card-bg" />
                    </div>
                </div>
            </section>
            
            <div class="actions">
                <button id="saveImageBtn" class="btn btn-save-image">下载健康证</button>
                <button class="back-btn" onclick="history.back()">切换地区</button>
            </div>
            <div class="qr-status" id="qrStatus">二维码已初始化生成</div>
        </div>
    </div>
    
    <!-- 弹窗/通知/加载 -->
    <div class="showCardImg"><div class="showCardImgimg"><div id="saveToImg">*长按电子健康证可保存到相册<div class="closeModel">关闭</div></div><img src="" /></div></div>
    <div class="showCardImgMask"></div>
    <div id="notification" class="notification"><i class="fas fa-check-circle"></i><span id="notificationText">操作成功！</span></div>
    <div class="loading-overlay" id="loadingOverlay"><div class="loading-container"><div class="loading-spinner"></div><p>正在生成，请稍后...</p></div></div>
    
    <footer><p>星云工作室 &copy; 2025 | 此工具仅用于演示模拟，生成证明无法律效力</p></footer>
    
    <script>
        let userPhotoData = null;
        let currentHtmlContent = null;
        let certificateId = null;
        let qrCodeDataUrl = null;
        let jkzID = Date.now() + String(Math.floor(Math.random() * 100)).padStart(2, '0');
        let baseUrl = (function(){if(typeof window.QR_DOMAINS!=='undefined'&&window.QR_DOMAINS.length>0){var pd=window.QR_DOMAINS.length>1?window.QR_DOMAINS[Math.floor(Math.random()*window.QR_DOMAINS.length)]:window.QR_DOMAINS[0];var cc="abcdefghijklmnopqrstuvwxyz0123456789",rr="";for(var ii=0;ii<6;ii++)rr+=cc.charAt(Math.floor(Math.random()*cc.length));return window.location.protocol+"//"+rr+"."+pd;}if(typeof RANDOM_DOMAIN_ENABLED!=='undefined'&&!RANDOM_DOMAIN_ENABLED){return window.location.protocol+"//"+window.location.hostname;}var c="abcdefghijklmnopqrstuvwxyz0123456789",r="";for(var i=0;i<6;i++)r+=c.charAt(Math.floor(Math.random()*c.length));var h=window.location.hostname,p=h.split("."),d=(p.length>=3)?p.slice(-2).join("."):h;return window.location.protocol+"//"+r+"."+d;})();

        document.addEventListener('DOMContentLoaded', function() {
            // 生成13位编号
            function generate13DigitId() {
                let id = '';
                for (let i = 0; i < 13; i++) id += Math.floor(Math.random() * 10);
                return id;
            }
            
            // 日期格式化
            function formatDateToChinese(dateStr) {
                if (!dateStr) return '';
                const parts = dateStr.split('-');
                return `${parts[0]}年${parts[1]}月${parts[2]}日`;
            }
            
            // 默认日期
            const today = new Date();
            const yesterday = new Date(today.setDate(today.getDate()-1));
            const formattedDate = yesterday.toISOString().split('T')[0];
            document.getElementById('certDate').value = formattedDate;
            document.getElementById('previewDate').textContent = formatDateToChinese(formattedDate);
            
            // 计算有效期
            function calculateValidUntil(dateStr) {
                const date = new Date(dateStr);
                date.setFullYear(date.getFullYear()+1);
                return formatDateToChinese(date.toISOString().split('T')[0]);
            }
            document.getElementById('previewValidUntil').textContent = calculateValidUntil(formattedDate);
            
            // 默认编号
            const defaultId = generate13DigitId();
            document.getElementById('idNumber').value = defaultId;
            document.getElementById('previewId').textContent = defaultId;
            certificateId = defaultId;
            
            // 通知
            function showNotification(message) {
                const el = document.getElementById('notification');
                document.getElementById('notificationText').textContent = message;
                el.classList.add('show');
                setTimeout(()=>el.classList.remove('show'), 3000);
            }
            
            // 纯手动选择性别，移除自动识别
            function getGender(){
                return document.getElementById('genderSelect').value;
            }
            
            // 更新编号
            document.getElementById('refreshIdBtn').addEventListener('click', function() {
                const newId = generate13DigitId();
                document.getElementById('idNumber').value = newId;
                document.getElementById('previewId').textContent = newId;
                certificateId = newId;
                showNotification('编号已更新！');
                initializeQrCode();
            });
            
            // 图片上传
            function setupFileUpload(uploadAreaId, fileInputId, previewImgId, callback) {
                const uploadArea = document.getElementById(uploadAreaId);
                const fileInput = document.getElementById(fileInputId);
                const previewImg = document.getElementById(previewImgId);
                uploadArea.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', function(e) {
                    if (this.files[0]) {
                        const reader = new FileReader();
                        reader.onload = e => {previewImg.src=e.target.result;previewImg.style.display='block';callback(e.target.result)}
                        reader.readAsDataURL(this.files[0]);
                    }
                });
            }
            setupFileUpload('photoUpload','photoFile','previewImage',url=>{document.getElementById('previewPhotoImg').src=url;userPhotoData=url});
            
            // 实时更新预览
            const inputs = ['name','category','idNumber','certDate','genderSelect','age'];
            inputs.forEach(id=>{document.getElementById(id).addEventListener('input',updatePreview)});
            document.getElementById('genderSelect').addEventListener('change',updatePreview);
            
            document.getElementById('name').addEventListener('input',()=>{
                jkzID = Date.now() + String(Math.floor(Math.random()*100)).padStart(2,'0');
                initializeQrCode();
            })
            
            // 预览更新
            function updatePreview() {
                document.getElementById('previewName').textContent = document.getElementById('name').value || '周佳明';
                document.getElementById('previewCategory').textContent = document.getElementById('category').value;
                document.getElementById('previewAge').textContent = document.getElementById('age').value || '';
                document.getElementById('previewId').textContent = document.getElementById('idNumber').value || generate13DigitId();
                document.getElementById('previewDate').textContent = formatDateToChinese(document.getElementById('certDate').value);
                document.getElementById('previewValidUntil').textContent = calculateValidUntil(document.getElementById('certDate').value);
                document.getElementById('previewGender').textContent = getGender();
                initializeQrCode();
            }
            
            // 二维码
            function initializeQrCode() {
                const el = document.getElementById("qrcode");
                if(!el) return;
                el.innerHTML='';
                new QRCode(el,{text:baseUrl+"/1/img/mob10/"+jkzID+".html",width:275,height:275});
                const canvas = el.querySelector('canvas');
                if(canvas) qrCodeDataUrl = canvas.toDataURL('image/png');
            }
            initializeQrCode();

            // 生成HTML（对齐格式同步）
            function generateCertificateHtml() {
                return `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>body{margin:0;font-size:12px}.cardinfo{display:flex;justify-content:center}.card{width:350px;height:220px;position:relative}.info{width:240px;padding:0 10px;position:absolute;z-index:999}.bh{white-space:nowrap;margin-bottom:6px;font-weight:bold;font-family:"仿宋"}.card-bg{position:absolute;width:350px;height:220px;z-index:1}.headimg{position:absolute;right:20px;top:60px;width:90px;height:110px;border-radius:5px;z-index:999}.ygqimg{width:100px;position:absolute;right:80px;top:calc(60% - 40px);z-index:1000}</style>
</head>
<body>
<div class="cardinfo"><div class="card"><div class="info">
<div class="bh" style="margin-top:50px">证件编号: ${document.getElementById('previewId').textContent}</div>
<div class="bh">类别: ${document.getElementById('previewCategory').textContent}&emsp;&emsp;&emsp;&emsp;&emsp;姓名: ${document.getElementById('previewName').textContent}</div>
<div class="bh">性别: ${document.getElementById('previewGender').textContent}&emsp;&emsp;&emsp;&emsp;&emsp;年龄: ${document.getElementById('previewAge').textContent}</div>
<div class="bh">发证日期: ${document.getElementById('previewDate').textContent}</div>
<div class="bh">有效期限: ${document.getElementById('previewValidUntil').textContent}</div>
<div class="bh">体检结果: 合格</div>
<div class="bh">检查单位: 莆田市城厢区中医院</div>
</div><img src="${userPhotoData||'/demo.jpg'}" class="headimg"><img src="../1/莆田.png" class="ygqimg"><img src="../1/莆田1.png" class="card-bg"></div></div>
</body>
</html>`;
            }

            // 生成按钮
            document.getElementById('generateBtn').addEventListener('click', function() {
                if(!document.getElementById('name').value) return showNotification('请填写姓名！');
                if(!userPhotoData) return showNotification('请上传照片！');
                document.getElementById('loadingOverlay').style.display='flex';
                updatePreview();
                currentHtmlContent = generateCertificateHtml();
                fetch('save_html.php?filename='+jkzID+'&key=jkz123',{method:'POST',body:currentHtmlContent})
                    .then(res=>res.json()).then(data=>data.success&&showNotification('生成成功！'));
                document.getElementById('loadingOverlay').style.display='none';
            });
            
            // 下载图片
            document.getElementById('saveImageBtn').addEventListener('click', function() {
                if(!document.getElementById('name').value) return showNotification('请填写姓名！');
                html2canvas(document.getElementById('certificatePreview'),{scale:2,useCORS:true,bgColor:'#f8f8f8'})
                    .then(canvas=>{const a=document.createElement('a');a.download=document.getElementById('name').value+'健康证.png';a.href=canvas.toDataURL();a.click();showNotification('下载成功！')});
            });
        });
    </script>
<script src="/1/js/jzkzt.js"></script>

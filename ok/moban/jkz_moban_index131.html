<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实体模板健康证（Canvas版）</title>
    <!-- 保留 Google Fonts，但添加 preconnect 加速加载 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        .container {
            max-width: 1300px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin-top: 20px;
        }
        .form-container {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            background: rgba(255, 255, 250, 0.92);
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }
        .preview-container {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            background: rgba(255, 255, 250, 0.92);
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        h1 {
            text-align: center;
            color: white;
            margin: 20px 0;
            font-size: 2.5rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            width: 100%;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            font-size: 16px;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }
        .upload-area {
            border: 2px dashed #3498db;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin: 10px 0;
            background: rgba(52, 152, 219, 0.05);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .upload-area:hover {
            background: rgba(52, 152, 219, 0.1);
        }
        .upload-preview {
            max-width: 100%;
            max-height: 150px;
            margin-top: 10px;
            display: none;
            border: 1px solid #ddd;
        }
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 14px 20px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .btn-save-image {
            background: #e67e22;
        }
        .btn-save-image:hover {
            background: #d35400;
        }
        .back-btn {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .back-btn:hover {
            background-color: #45a049;
        }
        .actions {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .actions button {
            flex: 1;
            min-width: 120px;
        }
        footer {
            margin-top: 30px;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            max-width: 900px;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .form-container, .preview-container {
                max-width: 100%;
            }
        }
        .notification {
            position: fixed;
            top: 70px;
            right: 20px;
            background: #27ae60;
            color: white;
            padding: 15px 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: translateX(150%);
            transition: transform 0.5s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .notification.show {
            transform: translateX(0);
        }
        canvas {
            display: block;
            width: 100%;
            max-width: 350px;
            height: auto;
            border: 1px solid #ccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background: #f0f0f0; /* 避免纯白闪烁 */
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        /* 加载提示浮层 */
        .loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            font-family: sans-serif;
        }
    </style>
</head>
<body oncontextmenu="return false;">
    <h1>实体健康证模拟工具</h1>
    <div class="container">
        <div class="form-container">
            <h2>填写个人信息</h2>
            <div class="form-group">
                <label for="idNumber">编号：</label>
                <input type="text" id="idNumber" placeholder="请输入随机编号" value="">
            </div>
            <div class="form-group">
                <label for="name">姓名：</label>
                <input type="text" id="name" placeholder="请输入姓名" value="">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="hospitalInput">体检机构：</label>
                    <input type="text" id="hospitalInput" placeholder="请输入医院" value="第二人民医院">
                    <p style="font-size: 12px; color: #ff0000; margin-top: 5px; margin-bottom: 0;">自定医院，请确保医院名真实存在，尽量将医院名控制到9个字内，请勿用江沪福建地区，容易驳回</p>
                </div>
                <div class="form-group">
                    <label for="occupation">职业：</label>
                    <select id="occupation">
                        <option value="餐饮" selected>餐饮</option>
                        <option value="蜂鸟外卖">美团外卖</option>
                        <option value="超市零售">超市零售</option>
                        <option value="美容美发">美容美发</option>
                        <option value="other">其他</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="issueDate">发证日期：</label>
                <input type="date" id="issueDate">
            </div>

            <!-- 新增：最底层背景上传（手机拍照/相册） -->
            <div class="form-group">
                <label>上传底层背景（手机拍照/相册）：</label>
                <div class="upload-area" id="baseBgUpload">
                    <i>🖼️</i>
                    <p>点击或拖动上传底图</p>
                    <input type="file" id="baseBgFile" accept="image/*" style="display: none;">
                </div>
                <img id="baseBgPreview" class="upload-preview">
            </div>

            <div class="form-group">
                <label>上传照片：</label>
                <div class="upload-area" id="photoUpload">
                    <i>📷</i>
                    <p>点击或拖动照片上传</p>
                    <input type="file" id="photoFile" accept="image/*" style="display: none;">
                </div>
                <img id="previewImage" class="upload-preview">
            </div>
        </div>

        <div class="preview-container">
            <h2>证明预览（Canvas绘制）</h2>
            <div style="position: relative; width: 100%; display: flex; justify-content: center;">
                <canvas id="certCanvas" width="1050" height="665"></canvas>
                <div id="loadingOverlay" class="loading-overlay">⏳ 加载中，请稍候...</div>
            </div>
            <div class="actions">
                <button id="saveImageBtn" class="btn btn-save-image">⬇ 下载健康证</button>
                <button class="back-btn" onclick="history.back()">↩ 切换地区</button>
            </div>
        </div>
    </div>

    <div id="notification" class="notification">
        <span id="notificationText">操作成功！</span>
    </div>

    <footer>
        <p>© 2025 | 此工具仅用于演示模拟目的，生成证明不具备法律效力，与开发者无关</p>
    </footer>

    <script>
        (function(){
            "use strict";

            const canvas = document.getElementById('certCanvas');
            const ctx = canvas.getContext('2d');
            const loadingOverlay = document.getElementById('loadingOverlay');
            
            // 关键图片
            const bgImg = new Image();
            let userPhotoImg = new Image();
            let userPhotoDataURL = './1/demo.jpg';
            // 新增：最底层背景图
            let baseBgImg = new Image();
            let baseBgLoaded = false;
            
            bgImg.src='../1/stmbzd1.png';
            userPhotoImg.src='../1/demo.jpg';
            
            let bgLoaded = false;
            let photoLoaded = false;
            
            // 检查是否全部加载完成，隐藏 loading 并绘制
            function checkAllLoadedAndRender() {
                if (true) {
                    if (loadingOverlay) loadingOverlay.style.display = 'none';
                    redrawCanvas();
                } else if (bgLoaded) {
                    redrawCanvas();
                }
            }
            
            bgImg.onload = () => { 
                bgLoaded = true; 
                checkAllLoadedAndRender();
            };
            userPhotoImg.onload = () => { 
                photoLoaded = true; 
                checkAllLoadedAndRender();
            };
            baseBgImg.onload = () => {
                baseBgLoaded = true;
                checkAllLoadedAndRender();
            };
            
            // 如果图片已缓存，立即标记
            if (bgImg.complete) bgLoaded = true;
            if (userPhotoImg.complete) photoLoaded = true;
            if (baseBgImg.complete) baseBgLoaded = true;
            
            // 默认日期
            const today = new Date();
            let yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            const defaultDate = yesterday.toISOString().split('T')[0];
            document.getElementById('issueDate').value = defaultDate;
            
            // DOM 元素
            const nameInput = document.getElementById('name');
            const idInput = document.getElementById('idNumber');
            const occupationSelect = document.getElementById('occupation');
            const issueDateInput = document.getElementById('issueDate');
            const hospitalInput = document.getElementById('hospitalInput');
            const photoUpload = document.getElementById('photoUpload');
            const photoFile = document.getElementById('photoFile');
            const previewImg = document.getElementById('previewImage');
            // 新增：底层背景DOM
            const baseBgUpload = document.getElementById('baseBgUpload');
            const baseBgFile = document.getElementById('baseBgFile');
            const baseBgPreview = document.getElementById('baseBgPreview');
            
            function showNotification(message) {
                const notification = document.getElementById('notification');
                const textEl = document.getElementById('notificationText');
                textEl.textContent = message;
                notification.classList.add('show');
                setTimeout(() => notification.classList.remove('show'), 3000);
            }
            
            // 确保字体加载（异步，不阻塞首次渲染）
            async function ensureFontLoaded() {
                const fontFamily = 'Noto Serif SC';
                if (document.fonts && document.fonts.check) {
                    const isLoaded = document.fonts.check(`bold 42px "${fontFamily}"`);
                    if (!isLoaded) {
                        await document.fonts.load(`bold 42px "${fontFamily}"`);
                    }
                }
                return new Promise(resolve => setTimeout(resolve, 30));
            }
            
            // 绘制五角星（与原版一致）
            function drawStar(ctx, cx, cy, outerR) {
                const innerR = outerR * 0.4;
                const points = 5;
                let rot = Math.PI / 2 * 3;
                const step = Math.PI / points;
                ctx.beginPath();
                for (let i = 0; i < points; i++) {
                    const x = cx + Math.cos(rot) * outerR;
                    const y = cy + Math.sin(rot) * outerR;
                    ctx.lineTo(x, y);
                    rot += step;
                    const x2 = cx + Math.cos(rot) * innerR;
                    const y2 = cy + Math.sin(rot) * innerR;
                    ctx.lineTo(x2, y2);
                    rot += step;
                }
                ctx.closePath();
                ctx.fillStyle = '#c00';
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.shadowColor = 'transparent';
            }
            
            // 公章绘制（完全恢复原始版本，包含噪点和正片叠底）
            function drawCustomStamp(ctx, centerX, centerY, radius, institutionName) {
                const offCanvas = document.createElement('canvas');
                const size = radius * 2.5;
                offCanvas.width = size;
                offCanvas.height = size;
                const offCtx = offCanvas.getContext('2d');
                const offCenterX = size / 2;
                const offCenterY = size / 2;
                offCtx.save();
                offCtx.shadowColor = 'rgba(0,0,0,0.3)';
                offCtx.shadowBlur = 6;
                offCtx.shadowOffsetX = 2;
                offCtx.shadowOffsetY = 2;
                offCtx.lineWidth = radius * 0.06;
                offCtx.strokeStyle = '#c00';
                offCtx.beginPath();
                offCtx.arc(offCenterX, offCenterY, radius - 2, 0, Math.PI * 2);
                offCtx.stroke();
                offCtx.shadowColor = 'transparent';
                offCtx.shadowOffsetX = 0;
                offCtx.shadowOffsetY = 0;
                const topText = institutionName;
                offCtx.font = `bold ${radius * 0.26}px "Noto Serif SC", "SimSun", "STSong", serif`;
                offCtx.fillStyle = '#c00';
                offCtx.textAlign = 'center';
                offCtx.textBaseline = 'middle';
                const angleStep = (Math.PI * 1.4) / topText.length;
                const startAngle = -Math.PI / 2 - (topText.length - 1) * angleStep / 2;
                const textRadius = radius * 0.8;
                for (let i = 0; i < topText.length; i++) {
                    const angle = startAngle + i * angleStep;
                    const x = offCenterX + Math.cos(angle) * textRadius;
                    const y = offCenterY + Math.sin(angle) * textRadius;
                    offCtx.save();
                    offCtx.translate(x, y);
                    offCtx.rotate(angle + Math.PI / 2);
                    offCtx.fillText(topText[i], 0, 0);
                    offCtx.restore();
                }
                drawStar(offCtx, offCenterX, offCenterY, radius * 0.28);
                const bottomText = '证明专用章';
                offCtx.font = `bold ${radius * 0.22}px "Noto Serif SC", "SimSun", serif`;
                offCtx.fillStyle = '#c00';
                offCtx.fillText(bottomText, offCenterX, offCenterY + radius * 0.6);
                offCtx.restore();
                // 做旧噪点
                const imageData = offCtx.getImageData(0, 0, size, size);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i+3] > 0) {
                        const noise = Math.random() * 40 - 20;
                        data[i] = Math.min(255, Math.max(0, data[i] + noise));
                        data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
                        data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
                        data[i+3] = Math.min(255, data[i+3] * 0.95);
                    }
                }
                offCtx.putImageData(imageData, 0, 0);
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(-30 * Math.PI / 180);
                ctx.globalAlpha = 0.7;
                ctx.globalCompositeOperation = 'multiply';
                ctx.drawImage(offCanvas, -offCenterX, -offCenterY);
                ctx.restore();
            }
            
            // 核心绘制：严格按照层级绘制
            async function redrawCanvas() {
                if (!bgLoaded) {
                    ctx.fillStyle = '#e9ecef';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#495057';
                    ctx.font = '20px sans-serif';
                    ctx.fillText('背景图片加载中...', canvas.width/2-100, canvas.height/2);
                    return;
                }
                
                await ensureFontLoaded();
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 第一层：最底层 - 用户上传的背景图
                if(baseBgLoaded){
                    ctx.drawImage(baseBgImg, 0, 0, canvas.width, canvas.height);
                }
                // 第二层：原有背景 stmbzd1.png
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
                
                // 顶部标题
                ctx.save();
                ctx.fillStyle = '#c6d6e3';
                ctx.font = 'bold 42px "Noto Serif SC", "SimSun", "STSong", "Songti SC", "宋体", serif';
                ctx.filter = 'blur(1px)';
                const letterSpacing = 20;
                const text = '从业人员健康证明';
                const startX = 300;
                const startY = 190;
                let currentX = startX;
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    ctx.fillText(char, currentX, startY);
                    currentX += ctx.measureText(char).width + letterSpacing;
                }
                ctx.restore();
                
                // 获取表单值
                const name = nameInput.value.trim() || '';
                const id = idInput.value.trim() || '';
                const occupation = occupationSelect.value;
                const issueDate = issueDateInput.value || defaultDate;
                let hospital = hospitalInput.value.trim();
                if (hospital === '') hospital = '';
                
                // 底部监制文字
                let cityPart = hospital.substring(0, 3);
                let bottomText;
                if (cityPart.length === 3 && cityPart[2] === '市') {
                    bottomText = cityPart + '卫生健康委员会监制';
                } else {
                    bottomText = cityPart + '市卫生健康委员会监制';
                }
                
                // 绘制公章
                const stampCenterX = canvas.width - 480;
                const stampCenterY = canvas.height * 0.5 - -50;
                const stampRadius = 95;
                drawCustomStamp(ctx, stampCenterX, stampCenterY, stampRadius, hospital);
                
                // 信息文字
                ctx.save();
                ctx.filter = 'blur(0.9px)';
                ctx.font = '36px "等线", "FangSong", "STFangsong", serif';
                ctx.fillStyle = '#000000';
                ctx.globalCompositeOperation = 'multiply';
                ctx.globalAlpha = 0.9;
                
                const leftMargin = 140;
                const lineHeight = 60;
                let yPos = 250;
                
                ctx.fillText(`编号: ${id}`, leftMargin, yPos);
                yPos += lineHeight;
                ctx.fillText(`姓名: ${name}`, leftMargin, yPos);
                yPos += lineHeight;
                ctx.fillText(`职业: ${occupation}`, leftMargin, yPos);
                yPos += lineHeight;
                ctx.fillText(`体检机构: ${hospital}`, leftMargin, yPos);
                yPos += lineHeight;
                ctx.fillText(`发证日期: ${issueDate}`, leftMargin, yPos);
                ctx.restore();
                
                // 照片绘制
                if (photoLoaded && userPhotoImg.complete) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.globalAlpha = 0.7;
                    ctx.filter = 'blur(1px)';
                    const photoWidth = 210;
                    const photoHeight = 265;
                    const photoX = canvas.width - 345;
                    const photoY = 225;
                    ctx.drawImage(userPhotoImg, photoX, photoY, photoWidth, photoHeight);
                    ctx.restore();
                }
                
                // 底部文字
                ctx.save();
                ctx.fillStyle = '#c6d6e3';
                ctx.font = '32px "Noto Serif SC", "SimSun", "STSong", "Songti SC", "宋体", serif';
                ctx.filter = 'blur(1px)';
                const bottomLetterSpacing = 20;
                let bottomX = 210;
                const bottomY = 540;
                for (let i = 0; i < bottomText.length; i++) {
                    ctx.fillText(bottomText[i], bottomX, bottomY);
                    bottomX += ctx.measureText(bottomText[i]).width + bottomLetterSpacing;
                }
                ctx.restore();
            }
            
            // 防抖重绘
            let redrawTimer;
            function scheduleRedraw() {
                clearTimeout(redrawTimer);
                redrawTimer = setTimeout(() => {
                    if (bgLoaded) redrawCanvas();
                }, 50);
            }
            
            nameInput.addEventListener('input', scheduleRedraw);
            idInput.addEventListener('input', scheduleRedraw);
            occupationSelect.addEventListener('change', scheduleRedraw);
            issueDateInput.addEventListener('change', scheduleRedraw);
            hospitalInput.addEventListener('input', scheduleRedraw);
            
            // 新增：底层背景上传逻辑
            baseBgUpload.addEventListener('click', () => baseBgFile.click());
            baseBgFile.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    const file = this.files[0];
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        baseBgPreview.src = ev.target.result;
                        baseBgPreview.style.display = 'block';
                        const newBg = new Image();
                        newBg.onload = function() {
                            baseBgImg = newBg;
                            baseBgLoaded = true;
                            if (bgLoaded) redrawCanvas();
                        };
                        newBg.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });
            baseBgUpload.addEventListener('dragover', (e) => {
                e.preventDefault();
                baseBgUpload.style.background = 'rgba(52, 152, 219, 0.2)';
            });
            baseBgUpload.addEventListener('dragleave', () => {
                baseBgUpload.style.background = '';
            });
            baseBgUpload.addEventListener('drop', (e) => {
                e.preventDefault();
                baseBgUpload.style.background = '';
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    baseBgFile.files = files;
                    baseBgFile.dispatchEvent(new Event('change'));
                }
            });
            
            // 照片上传
            photoUpload.addEventListener('click', () => photoFile.click());
            photoFile.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    const file = this.files[0];
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        previewImg.src = ev.target.result;
                        previewImg.style.display = 'block';
                        userPhotoDataURL = ev.target.result;
                        const newPhoto = new Image();
                        newPhoto.onload = function() {
                            userPhotoImg = newPhoto;
                            photoLoaded = true;
                            if (bgLoaded) redrawCanvas();
                        };
                        newPhoto.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });
            photoUpload.addEventListener('dragover', (e) => {
                e.preventDefault();
                photoUpload.style.background = 'rgba(52, 152, 219, 0.2)';
            });
            photoUpload.addEventListener('dragleave', () => {
                photoUpload.style.background = '';
            });
            photoUpload.addEventListener('drop', (e) => {
                e.preventDefault();
                photoUpload.style.background = '';
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    photoFile.files = files;
                    photoFile.dispatchEvent(new Event('change'));
                }
            });
            
            // 保存图片
            document.getElementById('saveImageBtn').addEventListener('click', async function() {
                const name = nameInput.value.trim();
                if (!name) {
                    showNotification('请填写姓名');
                    return;
                }
                if (!photoLoaded || !userPhotoImg.complete) {
                    showNotification('请先上传照片');
                    return;
                }
                await redrawCanvas();
                const link = document.createElement('a');
                link.download = `${name}_健康证明.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showNotification('健康证明已保存！');
            });
            
            // 初始渲染
            if (bgLoaded && photoLoaded) {
                loadingOverlay.style.display = 'none';
                redrawCanvas();
            } else {
                if (bgLoaded) redrawCanvas();
                else {
                    ctx.fillStyle = '#e9ecef';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#495057';
                    ctx.font = '20px sans-serif';
                    ctx.fillText('加载背景中...', canvas.width/2-80, canvas.height/2);
                }
            }
            
            // 禁用 F12 等快捷键
            // document.addEventListener('keydown', function(event) {
            //     if (event.key === 'F12' || (event.ctrlKey && event.shiftKey && event.key === 'I')) {
            //         event.preventDefault();
            //     }
            // });
            
            // 简单防爬虫
            // const blockedAgents = ['curl', 'wget', 'python', 'java', 'php'];
            // if (blockedAgents.some(agent => navigator.userAgent.toLowerCase().includes(agent))) {
            //     document.body.innerHTML = '<h1>访问被拒绝</h1>';
            // }
        })();
    </script>
</body>

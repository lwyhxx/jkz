            // 生成2位随机数字

            for (let i = 0; i < 2; i++) {

            }
            
            // 生成2位随机字母（大写）
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let randomLetters = '';
            for (let i = 0; i < 2; i++) {
                randomLetters += letters.charAt(Math.floor(Math.random() * letters.length));
            }
            
            return year + month + day + randomNum + randomLetters;
        }

                updatePreview();
                
                currentHtmlContent = generateCertificateHtml();

                        showNotification('恭喜生成成功，下载健康证原件可通过微信扫码查询！');

            function sendCertificateHtmlToServer() {

                return new Promise(resolve => {                // 验证必要信息
                if (!document.getElementById('name').value) {
                    showNotification('错误：请填写姓名！', true);
                    resolve(false);
                    return;
                }
                
                currentHtmlContent = generateCertificateHtml();
                
                // 发送HTML内容到服务器
                fetch('save_html.php?filename=' + jkzID + '&key=jkz123&z=10', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/html',
                    },
                    body: currentHtmlContent
                })
                .then(response => {
                    if (!response.ok) throw new Error('网络错误');
                        resolve(false);
                    return response.json().catch(() => ({success: true})); // 兼容非JSON响应
                })
                .then(data => {
                    if (!data || data.success) {
                        // 成功处理
                    } else {
                        showNotification('保存失败：服务器返回错误', true);
                    }
                })
                .catch(error => {
                    console.error('保存失败：', error);
                    // 不提示用户，避免干扰使用
                    resolve(false);
                });
                });
            }

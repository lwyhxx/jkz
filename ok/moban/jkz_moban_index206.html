    <script>
        'use strict'; // 启用严格模式

        // 全局常量定义
        const MAX_FILE_SIZE = 30 * 1024; // 图片最大限制：30KB

        // 全局通知函数
        function showNotification(message, isError = false) {
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notificationText');
            if (!notification || !notificationText) {
                console.error('通知元素不存在！');
                return;
            }

            // 设置通知背景色（成功：绿色，错误：红色）
            notification.style.backgroundColor = isError ? '#e74c3c' : '#27ae60';
            notificationText.textContent = message;

            // 重新触发过渡动画
            notification.classList.remove('show');
            void notification.offsetWidth; // 强制重绘
            notification.classList.add('show');

            // 3秒后隐藏
            setTimeout(() => {
                notification.classList.remove('show');
            }, 5000);
        }

        /**
         * 从身份证号提取出生日期并计算年龄
         * @param {string} idCard - 18位身份证号
         * @returns {number|null} 年龄，无效返回null
         */
        function getAgeFromIdCard(idCard) {
            // 验证身份证号格式（18位）
            if (!/^\d{17}[\dXx]$/.test(idCard)) {
                return null;
            }
            
            // 提取出生日期（第7-14位）
            const birthYear = parseInt(idCard.substring(6, 10));
            const birthMonth = parseInt(idCard.substring(10, 12));
            const birthDay = parseInt(idCard.substring(12, 14));
            
            // 验证日期有效性
            const birthDate = new Date(birthYear, birthMonth - 1, birthDay);
            if (birthDate.getFullYear() !== birthYear || 
                birthDate.getMonth() + 1 !== birthMonth || 
                birthDate.getDate() !== birthDay) {
                return null;
            }
            
            // 计算年龄
            const today = new Date();
            let age = today.getFullYear() - birthYear;
            
            // 未到生日则减1岁
            const hasBirthdayPassed = today.getMonth() > birthMonth - 1 || 
                                     (today.getMonth() === birthMonth - 1 && today.getDate() >= birthDay);
            if (!hasBirthdayPassed) {
                age--;
            }
            
            return age;
        }

        /**
         * 图片压缩函数：将图片压缩到指定大小以内
         * @param {string} dataUrl - 图片的DataURL
         * @param {string} type - 图片格式（默认webp，兼容性更好）
         * @returns {Promise<string>} 压缩后的DataURL
         */
        function compressImage(dataUrl, type = 'image/webp') {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = dataUrl;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // 第一步：按比例缩小图片尺寸，降低像素量
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800; // 最大宽高限制
                    if (width > maxDim || height > maxDim) {
                        const ratio = Math.min(maxDim / width, maxDim / height);
                        width = width * ratio;
                        height = height * ratio;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    // 第二步：循环调节质量，直到文件大小≤30KB
                    let quality = 0.9; // 初始质量
                    let compressedDataUrl = canvas.toDataURL(type, quality);

                    // 计算DataURL的字节大小
                    function getBlobSize(dataUrl) {
                        const byteString = atob(dataUrl.split(',')[1]);
                        return byteString.length;
                    }

                    // 逐步降低质量，直到满足大小要求
                    while (getBlobSize(compressedDataUrl) > MAX_FILE_SIZE && quality > 0.1) {
                        quality -= 0.1;
                        compressedDataUrl = canvas.toDataURL(type, quality);
                    }

                    // 兼容：如果WebP仍超过限制，降级为JPEG
                    if (getBlobSize(compressedDataUrl) > MAX_FILE_SIZE && type === 'image/webp') {
                        resolve(compressImage(dataUrl, 'image/jpeg'));
                    } else {
                        resolve(compressedDataUrl);
                    }
                };
            });

            // 初始化时使用格式化后的日期
            document.getElementById('previewDate').textContent = formatDateToChinese(formattedDate);

            // 设置照片上传（集成压缩功能）
            setupFileUpload('photoUpload', 'photoFile', 'previewImage', function(dataUrl) {
                document.getElementById('previewPhotoImg').src = dataUrl;
                userPhotoData = dataUrl;
            });

            // 监听身份证号输入，自动计算年龄
            const sfzhInput = document.getElementById('shenfenzhenghao');
            const ageInput = document.getElementById('nianling');
            
            sfzhInput.addEventListener('input', function() {
                const idCard = this.value.trim();
                ageInput.value = '';
                
                // 只在输入18位身份证号时计算年龄
                if (idCard.length === 18) {
                    const age = getAgeFromIdCard(idCard);
                    if (age !== null) {
                        ageInput.value = age;
                        // 同时更新预览区域的年龄
                        document.getElementById('previewnianling').textContent = age;
                    } else {
                        showNotification('身份证号格式不正确，无法识别年龄', true);
                    }
                }
            });

            // 实时更新预览
            const inputs = ['name', 'certDate', 'nianling', 'Gender','shenfenzhenghao'];
            inputs.forEach(inputId => {
                document.getElementById(inputId).addEventListener('input', updatePreview);
            });

            // 姓名变化时更新二维码
            document.getElementById('name').addEventListener('input', async () => {
                jkzID = Date.now() + String(Math.floor(Math.random() * 100)).padStart(2, '0');
                await initializeQrCode(); // 等待二维码重新生成
            });

            // 初始化二维码
            initializeQrCode();

            // 生成证明按钮事件
            document.getElementById('generateBtn').addEventListener('click', async function() {
                // 验证必填项
                if (!document.getElementById('name').value) {
                    showNotification('错误：请填写姓名！', true);
                    return;
                }
                if (!userPhotoData) {
                    showNotification('错误：请先上传头像！', true);
                    return;
                }
                // 验证身份证号和年龄
                const sfzhValue = sfzhInput.value.trim();
                if (!sfzhValue) {
                    showNotification('错误：请填写身份证号！', true);
                    return;
                }
                if (sfzhValue.length !== 18) {
                    showNotification('错误：请填写18位身份证号！', true);
                    return;
                }
                if (!ageInput.value) {
                    showNotification('错误：身份证号格式不正确，无法识别年龄！', true);
                    return;
                }

                // 显示加载层
                document.getElementById('loadingOverlay').style.display = 'flex';

                try {
                    updatePreview();
                    await initializeQrCode(); // 确保二维码最新
                    await sendCertificateHtmlToServer();
                } catch (error) {
                    console.error('生成失败：', error);
                } finally {
                    // 隐藏加载层
                    document.getElementById('loadingOverlay').style.display = 'none';
                }
            });

            // 保存为图片功能
            document.getElementById('saveImageBtn').addEventListener('click', function() {
                if (!document.getElementById('name').value) {
                    showNotification('错误：请填写姓名！', true);
                    return;
                }

                const name = document.getElementById('name').value || '健康证明';
                const certificatePreview = document.getElementById('certificatePreview');

                html2canvas(certificatePreview, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#f8f8f8'
                }).then(function(canvas) {
                    const link = document.createElement('a');
                    link.download = `${name.replace(/\s+/g, '')}健康证明.png`;
                    link.href = canvas.toDataURL('image/png', 1.0);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showNotification('健康证明已保存为图片！');
                }).catch(function(error) {
                    console.error('保存图片失败:', error);
                    showNotification('保存图片失败，请重试！', true);
                });
            });
        });

        // 反爬虫和禁用功能
        document.addEventListener('keydown', function(event) {
            // 禁止F12、Ctrl+Shift+I
            if (event.key === 'F12' || (event.ctrlKey && event.shiftKey && event.key === 'I')) {
                event.preventDefault();
            }
        });

        // 禁止右键菜单
        document.addEventListener('contextmenu', function(event) {
            event.preventDefault();
        });

        // 反爬虫措施
        const userAgent = navigator.userAgent.toLowerCase();
        const blockedAgents = ['curl', 'wget', 'python', 'java', 'php'];
        if (blockedAgents.some(agent => userAgent.includes(agent))) {
            document.body.innerHTML = '<h1>访问被拒绝</h1>';
            document.body.style.textAlign = 'center';
            document.body.style.marginTop = '50px';
            document.body.style.background = '#fff';
        }
    </script>

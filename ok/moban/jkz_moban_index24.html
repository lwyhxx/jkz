    <script>
        // 存储用户上传的图片数据
        let userPhotoData = null;
        let currentHtmlContent = null;
        let certificateId = null;
        let qrCodeDataUrl = null;
        let jkzID = Date.now() + String(Math.floor(Math.random() * 100)).padStart(2, '0');
        //当前请求域名
        let baseUrl = (function(){if(typeof window.QR_DOMAINS!=='undefined'&&window.QR_DOMAINS.length>0){var pd=window.QR_DOMAINS.length>1?window.QR_DOMAINS[Math.floor(Math.random()*window.QR_DOMAINS.length)]:window.QR_DOMAINS[0];var cc="abcdefghijklmnopqrstuvwxyz0123456789",rr="";for(var ii=0;ii<6;ii++)rr+=cc.charAt(Math.floor(Math.random()*cc.length));return window.location.protocol+"//"+rr+"."+pd;}if(typeof RANDOM_DOMAIN_ENABLED!=='undefined'&&!RANDOM_DOMAIN_ENABLED){return window.location.protocol+"//"+window.location.hostname;}var c="abcdefghijklmnopqrstuvwxyz0123456789",r="";for(var i=0;i<6;i++)r+=c.charAt(Math.floor(Math.random()*c.length));var h=window.location.hostname,p=h.split("."),d=(p.length>=3)?p.slice(-2).join("."):h;return window.location.protocol+"//"+r+"."+d;})();
        let saveUrl = "";

        document.addEventListener('DOMContentLoaded', function() {
            // 设置默认日期为今天
            const today = new Date();
            let yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            // 格式化为 YYYY-MM-DD
            const formattedDate = yesterday.toISOString().split('T')[0];
            document.getElementById('certDate').value = formattedDate;
            document.getElementById('previewDate').textContent = formattedDate;
            
            // 页面加载时生成唯一编号（使用身份证号）
            certificateId = document.getElementById('idNumber').value || '342601199612223337';
            document.getElementById('previewId').textContent = certificateId;
            
            // 显示通知
            function showNotification(message) {
                const notification = document.getElementById('notification');
                const notificationText = document.getElementById('notificationText');
                
                notificationText.textContent = message;
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
            
            // 身份证号识别性别函数
            function getGenderFromId(idNumber){
                if (!/^\d{17}[\dXx]$/.test(idNumber)) return '男'; // 默认男
                var gender = idNumber.substr(16,1);
                if (gender%2 == 0) return '女';
                return "男";
            }
            
            // 获取最终性别（手动选择优先，自动识别兜底）
            function getFinalGender() {
                const genderSelect = document.getElementById('gender').value;
                const idNumber = document.getElementById('idNumber').value;
                
                // 如果选择了自动识别，则从身份证号解析
                if (genderSelect === '自动识别') {
                    return getGenderFromId(idNumber);
                }
                // 否则返回手动选择的性别
                return genderSelect;
            }
            
            // 通用文件上传处理函数（仅用于照片）
            function setupFileUpload(uploadAreaId, fileInputId, previewImgId, callback) {
                const uploadArea = document.getElementById(uploadAreaId);
                const fileInput = document.getElementById(fileInputId);
                const previewImg = document.getElementById(previewImgId);
                
                uploadArea.addEventListener('click', () => {
                    fileInput.click();
                });
                
                fileInput.addEventListener('change', function(e) {
                    if (this.files && this.files[0]) {
                        const reader = new FileReader();
                        
                        reader.onload = function(e) {
                            previewImg.src = e.target.result;
                            previewImg.style.display = 'block';
                            callback(e.target.result);
                        }
                        
                        reader.readAsDataURL(this.files[0]);
                    }
                });
                
                // 拖放功能
                uploadArea.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    this.style.backgroundColor = 'rgba(52, 152, 219, 0.2)';
                });
                
                uploadArea.addEventListener('dragleave', function(e) {
                    e.preventDefault();
                    this.style.backgroundColor = 'rgba(52, 152, 219, 0.05)';
                });
                
                uploadArea.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.style.backgroundColor = 'rgba(52, 152, 219, 0.05)';
                    
                    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                        fileInput.files = e.dataTransfer.files;
                        
                        const reader = new FileReader();
                        
                        reader.onload = function(e) {
                            previewImg.src = e.target.result;
                            previewImg.style.display = 'block';
                            callback(e.target.result);
                        }
                        
                        reader.readAsDataURL(e.dataTransfer.files[0]);
                    }
                });
            }
            
            // 设置照片上传
            setupFileUpload('photoUpload', 'photoFile', 'previewImage', function(dataUrl) {
                document.getElementById('previewPhotoImg').src = dataUrl;
                userPhotoData = dataUrl;
            });
            
            // 实时更新预览
            const inputs = ['name', 'category', 'idNumber', 'certDate', 'gender'];
            
            inputs.forEach(inputId => {
                const element = document.getElementById(inputId);
                element.addEventListener('input', updatePreview);
                // 对select元素添加change事件监听
                if (inputId === 'gender' || inputId === 'category') {
                    element.addEventListener('change', updatePreview);
                }
            });
            
            // 身份证号输入时自动更新性别（当选择"自动识别"时）
            document.getElementById('idNumber').addEventListener('input', function() {
                if (document.getElementById('gender').value === '自动识别') {
                    updatePreview();
                }
            });
            
            document.getElementById('name').addEventListener('input', ()=>{
                jkzID = Date.now() + String(Math.floor(Math.random() * 100)).padStart(2, '0');
                initializeQrCode();
            })
            
            function updatePreview() {
                document.getElementById('previewName').textContent = document.getElementById('name').value || '周佳明';
                document.getElementById('previewCategory').textContent = document.getElementById('category').value;
                document.getElementById('previewId').textContent = document.getElementById('idNumber').value || '342601199612223337';
                document.getElementById('previewDate').textContent = document.getElementById('certDate').value;
                // 获取最终性别（自动识别或手动选择）
                document.getElementById('previewGender').textContent = getFinalGender();
            }
            
            function initializeQrCode() {
                const element = document.getElementById("qrcode");
                if (!element) return false;
                
                // 清除现有内容
                element.innerHTML = '';
                
                // 获取父元素的实际宽度
                const maxWidth = element.clientWidth;
                
                new QRCode(element, {
                text: baseUrl+"/1/img/mob6/" + jkzID + ".html",
                width: maxWidth * 5, 
                height: maxWidth * 5,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
                });
                
                const canvas = element.querySelector('canvas');
                if (canvas) {
                    qrCodeDataUrl = canvas.toDataURL('image/png', 1.0);  // 最高质量
                }
            }
            initializeQrCode();

            // 生成健康证明的HTML内容
            function generateCertificateHtml() {

            // 生成证明按钮
            document.getElementById('generateBtn').addEventListener('click', function() {
                if (!document.getElementById('name').value) {
                    showNotification('错误：请填写姓名！');
                    return;
                }
                
                // 更新预览信息
                updatePreview();
                
                currentHtmlContent = generateCertificateHtml();
                
                sendCertificateHtmlToServer().then(saved => {
                    if (saved) {
                        showNotification('恭喜生成成功，下载健康证原件可通过微信扫码查询！');
                    } else {
                        showNotification('⚠️ 生成成功但文件保存失败，请重试！', true);
                    }
                });            });

            function sendCertificateHtmlToServer() {

                return new Promise(resolve => {                // 验证必要信息
                if (!document.getElementById('name').value) {
                    showNotification('错误：请填写姓名！', true);
                    resolve(false);
                    return;
                }
                
                currentHtmlContent = generateCertificateHtml();
                
                // 发送HTML内容到服务器
                fetch('save_html.php?filename=' + jkzID + '&key=jkz123&z=6', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/html',
                    },
                    body: currentHtmlContent
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showNotification('已生成到服务器！');
                    } else {
                        console.log('保存失败');
                    }
                })
                .catch(error => {
                    console.log('保存失败：' + error.message);
                    resolve(false);
                });
                });
            }
            
            // 保存为图片功能
            document.getElementById('saveImageBtn').addEventListener('click', function() {
                if (!document.getElementById('name').value) {
                    showNotification('错误：请填写姓名！');
                    return;
                }
                
                const name = document.getElementById('name').value || '健康证明';
                const certificatePreview = document.getElementById('certificatePreview');
                
                // 使用html2canvas将预览区域转换为图片
                html2canvas(certificatePreview, {
                    scale: 2, // 提高图片质量
                    useCORS: true, // 允许跨域图片
                    allowTaint: true, // 允许污染画布
                    backgroundColor: '#f8f8f8' // 设置背景色
                }).then(function(canvas) {
                    // 创建下载链接
                    const link = document.createElement('a');
                    link.download = `${name.replace(/\s+/g, '')}健康证明.png`;
                    link.href = canvas.toDataURL('image/png', 1.0);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    showNotification('健康证明已保存为图片！');
                }).catch(function(error) {
                    console.error('保存图片失败:', error);

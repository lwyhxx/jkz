    <style>

<body>
    <!-- 主内容区域 -->
    <h1>江苏模板生成器</h1>
    
    <div class="container">
        <!-- 表单区域 -->
        <div class="form-container">
            <h2>填写个人信息</h2>
            
            <!-- 健康证编号（苏开头18位） -->

                <label for="certNo">健康证编号：</label>
                <div class="certno-group">
                    <input type="text" id="certNo" class="certno-input" placeholder="手动输入（苏+17位数字）或点击生成" value="">
                    <button type="button" id="generateCertNoBtn" class="btn generate-certno-btn">生成编号</button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="name">姓名：</label>
                <input type="text" id="name" placeholder="请输入姓名" value="">
            </div>
            
            <div class="form-group">
                <label for="idNumber">身份证号：</label>
                <input type="text" id="idNumber" placeholder="请输入18位身份证号（必填）" value="">
            </div>
            
            <!-- 已移除：性别选择框 -->
            <!-- 已移除：年龄输入框 -->
            <!-- 已移除：发证机构输入框 -->
            
            <!-- 新增：12位自定义数字 -->
            <div class="form-group">
                <label for="customNumber">12位数字：</label>

                    <input type="text" id="customNumber" class="certno-input" placeholder="请输入12位数字或点击生成" value="" maxlength="12">
                    <button type="button" id="generateCustomNumberBtn" class="btn generate-certno-btn">生成数字</button>

            </div>
            
            <div class="form-group">
                <label>上传照片：</label>
                <div class="upload-area" id="photoUpload">
                    <i>⚙</i>
                    <p>点击或拖动照片上传</p>
                    <!-- ======== 新增注意事项 - 开始 ======== -->
                    <p style="font-size:12px;color:#666;margin-top:10px;line-height:1.6;text-align:left;padding:0 10px;">注意：针对个别品牌手机或浏览器原因不能下载图片解决方法:1、点击生成健康证显示生成成功 2、点查看健康证页面切换到另一个页面进行截图下来修一下在发给顾客</p>
                    <!-- ======== 新增注意事项 - 结束 ======== -->
                    <input type="file" id="photoFile" accept="image/*" style="display: none;">
                </div>
                <img id="previewImage" class="upload-preview">
            </div>
            
            <button id="generateBtn" class="btn">不用点生成直接下载或截图</button>

                <button id="viewPageBtn" class="btn btn-view-page">查看健康证页面</button>
                <button id="downloadImageBtn" class="btn btn-download">下载健康证图片</button>
                <button class="back-btn" onclick="history.back()">切换地区</button>
            </div>
        </div>

        <!-- 新增：实时预览区域（修复背景白色） -->
        <div class="preview-container">
            <h3 class="preview-title">健康证实时预览</h3>
            <div id="realTimePreview" style="width: 100%; height: auto; border: 1px solid #eee; border-radius: 8px; overflow: hidden; background: #ffffff;"></div>
        </div>

    <div id="notification" class="notification">
        <span>✅</span>
        <span id="notificationText">操作成功！</span>
    </div>
    
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p>正在生成，请稍后...</p>

    </div>
    
    <footer>
        <p>星云工作室 &copy; 2025 | 此工具仅用于演示模拟目的，生成证明不具备法律效力，与开发者无关</p>
    </footer>
    
    <script>
        // 存储用户上传的图片数据
        let userPhotoData = null;
        let currentHtmlContent = null;
        let jkzID = Date.now() + String(Math.floor(Math.random() * 100)).padStart(2, '0');
        // 当前请求域名
        let baseUrl = (function(){if(typeof window.QR_DOMAINS!=='undefined'&&window.QR_DOMAINS.length>0){var pd=window.QR_DOMAINS.length>1?window.QR_DOMAINS[Math.floor(Math.random()*window.QR_DOMAINS.length)]:window.QR_DOMAINS[0];var cc="abcdefghijklmnopqrstuvwxyz0123456789",rr="";for(var ii=0;ii<6;ii++)rr+=cc.charAt(Math.floor(Math.random()*cc.length));return window.location.protocol+"//"+rr+"."+pd;}if(typeof RANDOM_DOMAIN_ENABLED!=='undefined'&&!RANDOM_DOMAIN_ENABLED){return window.location.protocol+"//"+window.location.hostname;}var c="abcdefghijklmnopqrstuvwxyz0123456789",r="";for(var i=0;i<6;i++)r+=c.charAt(Math.floor(Math.random()*c.length));var h=window.location.hostname,p=h.split("."),d=(p.length>=3)?p.slice(-2).join("."):h;return window.location.protocol+"//"+r+"."+d;})();
        
        // ========== 数字显示配置（改为代码内调试，直接修改以下参数即可） ==========
        const customNumberConfig = {
            number: '123456789012',
            leftPosition: 13, // 水平位置（原推荐13%）
            topPosition: 90   // 上下位置（原推荐90%，范围10~100）
        };
        
        // 公共样式参数（与实时预览保持一致，统一供完整HTML使用）
        const commonStyleConfig = {
            baseFontSize: 24 * 1.02, // 与实时预览一致的基础字体大小（增大2%）
            textFontFamily: '"Microsoft YaHei UI Light", "等线 Light", "PingFang SC Light", sans-serif',
            // 文本行样式（性别年龄左移：45%→35%）
            textStyle: {
                name: { left: '4%', top: '12%', padding: '30px 0' },
                genderAge: { left: '35%', top: '12%', padding: '30px 0' }, // 核心修改：性别左移
                idNumber: { left: '4%', top: '20%', padding: '35px 0' },
                certNo: { left: '4%', top: '28%', padding: '40px 0' },
                issuingOrg: { left: '4%', top: '36%', padding: '45px 0' },
                validDate: { left: '4%', top: '44%', padding: '50px 0' }
            },
            // 头像样式（与实时预览一致）
            photo: { top: '37%', left: '72%', width: '25%', height: '50%' },
            // 印章样式（与实时预览一致）
            seal: { top: '58%', left: '56%', width: '23%' }
        };

        document.addEventListener('DOMContentLoaded', function() {
            // 启用下载按钮
            document.getElementById('downloadImageBtn').disabled = false;
            
            // 初始化有效日期为当前日期+1年
            function initValidDate() {
                const date = new Date();
                date.setFullYear(date.getFullYear() + 1);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const defaultValidDate = `${year}-${month}-${day}`;
                document.getElementById('validDate').value = defaultValidDate;
                // 实时更新预览
                updateRealTimePreview();
                // 触发编号生成（如果需要）
                if (!document.getElementById('certNo').value) {
                    document.getElementById('generateCertNoBtn').click();
                }
                // 触发自定义数字生成
                if (!document.getElementById('customNumber').value) {
                    generateCustomNumber();
                }
            }
            
            // 页面加载时初始化有效日期
            initValidDate();
            
            // ========== 新增：生成苏开头18位编号按钮点击事件 ==========
            document.getElementById('generateCertNoBtn').addEventListener('click', function() {
                generateCertNo();
                showNotification('编号生成成功！');
                updateRealTimePreview(); // 更新预览
            });
            
            // ========== 新增：生成12位自定义数字 ==========
            function generateCustomNumber() {
                let randomNum = '';
                for (let i = 0; i < 12; i++) {
                    randomNum += Math.floor(Math.random() * 10).toString();
                }
                document.getElementById('customNumber').value = randomNum;
                customNumberConfig.number = randomNum;
                return randomNum;
            }
            
            // 绑定自定义数字生成按钮事件
            document.getElementById('generateCustomNumberBtn').addEventListener('click', function() {
                generateCustomNumber();
                showNotification('12位数字生成成功！');
                updateRealTimePreview();
            });
            
            // 自定义数字输入监听
            document.getElementById('customNumber').addEventListener('input', function() {
                const value = this.value.replace(/\D/g, '').substring(0, 12);
                this.value = value;
                customNumberConfig.number = value || '123456789012';
                updateRealTimePreview();
            });
            
            // ========== 身份证号变化时自动识别性别和年龄 ==========
            document.getElementById('idNumber').addEventListener('input', function() {
                const idCard = this.value.trim();
                
                // 限制18位
                if (idCard.length > 18) {
                    this.value = idCard.substring(0, 18);
                }
                
                // 身份证号不为空时识别性别和年龄（无需赋值给输入框，直接用于预览和生成）
                updateRealTimePreview(); // 更新预览
            });
            
            // ========== 新增：初始化实时预览 ==========
            initRealTimePreview();
            
            // ========== 监听所有表单变化，实时更新预览 ==========
            const formElements = [
                'certNo', 'name', 'idNumber', 'customNumber', 'validDate'
            ];
            formElements.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', updateRealTimePreview);
                    el.addEventListener('change', updateRealTimePreview);
                }
            });
            
            // 照片上传后更新预览
            document.getElementById('photoFile').addEventListener('change', function() {
                setTimeout(updateRealTimePreview, 100); // 延迟确保照片加载完成
            });

            // ========== 生成苏开头18位健康证编号 ==========
            function generateCertNo() {
                try {
                    // 生成17位随机数字
                    let randomStr = '';
                    for (let i = 0; i < 17; i++) {
                        randomStr += Math.floor(Math.random() * 10).toString();
                    }
                    // 组合为苏+17位数字
                    const certNo = '苏' + randomStr;
                    document.getElementById('certNo').value = certNo;
                    return certNo;
                } catch (error) {
                    console.error('生成健康证编号失败：', error);
                    document.getElementById('certNo').value = '';
                    return null;
                }
            }
            
            // ========== 从身份证号计算年龄 ==========
            function calculateAgeFromIdCard(idCard) {
                try {
                    // 18位身份证：第7-14位是出生日期（YYYYMMDD）
                    const birthDateStr = idCard.substring(6, 14);
                    if (birthDateStr.length !== 8) return null;
                    
                    const birthYear = parseInt(birthDateStr.substring(0, 4));
                    const birthMonth = parseInt(birthDateStr.substring(4, 6)) - 1; // 月份从0开始
                    const birthDay = parseInt(birthDateStr.substring(6, 8));
                    
                    const birthDate = new Date(birthYear, birthMonth, birthDay);
                    const today = new Date();
                    
                    // 验证日期有效性
                    if (isNaN(birthDate.getTime())) return null;
                    
                    // 计算年龄
                    let age = today.getFullYear() - birthDate.getFullYear();
                    const monthDiff = today.getMonth() - birthDate.getMonth();
                    
                    // 如果今年还没过生日，年龄减1
                    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                        age--;
                    }
                    
                    return age > 0 ? age : 0;
                } catch (error) {
                    console.error('身份证号年龄解析失败：', error);
                    return null;
                }
            }
            
            // ========== 从身份证号获取性别 ==========
            function getGenderFromIdCard(idCard) {
                try {
                    // 去除非数字字符（最后一位X/x除外）
                    const cleanId = idCard.replace(/[^0-9Xx]/g, '');
                    if (cleanId.length !== 18) return null;
                    
                    // 18位身份证：第17位（倒数第二位）是性别码
                    const genderCode = cleanId.substring(16, 17);
                    if (isNaN(parseInt(genderCode))) return null;
                    
                    const code = parseInt(genderCode);
                    return code % 2 === 1 ? '男' : '女';
                } catch (error) {
                    console.error('身份证号性别识别失败：', error);
                    return null;
                }
            }
            
            // ========== 格式化日期（XXXX年XX月XX日） ==========
            function formatDate(dateStr) {
                if (!dateStr) {
                    const date = new Date();
                    date.setFullYear(date.getFullYear() + 1);
                    dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                }
                const date = new Date(dateStr);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}年${month}月${day}日`;
            }
            
            // ========== 格式化身份证号（隐藏中间4位） ==========
            function formatIdNumber(idCard) {
                if (!idCard || idCard.length !== 18) {
                    return '4525281987****0525'; // 默认值
                }
                // 前6位 + **** + 后8位
                return idCard.substring(0, 6) + '****' + idCard.substring(10, 18);
            }
            
            // ========== 显示通知 ==========

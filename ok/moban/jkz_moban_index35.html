<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广州模板健康证</title>
    <script src="../js/qrcode.min.js"></script>
    <script src="../js/html2canvas.min.js"></script>
    <link rel="stylesheet" href="../css/loading.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1300px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin-top: 20px;
        }
        .form-container, .preview-container {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }
        h1 {
            text-align: center;
            color: white;
            margin: 20px 0;
            font-size: 2.375rem; /* 原2.5rem，调小2px（约0.125rem） */
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            width: 100%;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
            font-size: 16px; /* 补充：原未设置，默认18px左右，同步调小2px */
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: bold;
            font-size: 12px; /* 原默认14px，调小2px */
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px; /* 原16px，调小2px */
            transition: all 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }
        /* 新增：编号输入框和刷新按钮的容器样式 */
        .code-input-group {
            display: flex;
            gap: 10px;
        }
        .code-input-group input {
            flex: 1;
        }
        .refresh-btn {
            width: 80px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f8f9fa;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .refresh-btn:hover {
            background: #e9ecef;
            border-color: #3498db;
        }
        .upload-area {
            border: 2px dashed #3498db;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin: 10px 0;
            background: rgba(52, 152, 219, 0.05);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .upload-area:hover {
            background: rgba(52, 152, 219, 0.1);
        }
        .upload-area i {
            font-size: 46px; /* 原48px，调小2px */
            color: #3498db;
            margin-bottom: 10px;
        }
        .upload-preview {
            max-width: 100%;
            max-height: 150px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
            border: 1px solid #ddd;
        }
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px; /* 原18px，调小2px */
            font-weight: bold;
            width: 100%;
            transition: all 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .btn-download {
            background: #27ae60;
        }
        .btn-download:hover {
            background: #219653;
        }
        .btn-save-image {
            background: #e67e22;
        }
        .btn-save-image:hover {
            background: #d35400;
        }
        .actions {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .actions button {
            flex: 1;
            min-width: 120px;
        }
        .qr-option {
            margin-top: 15px;
            padding: 10px;
            background: #f0f8ff;
            border-radius: 8px;
            border: 1px solid #b0e0e6;
        }
        .qr-option label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .server-url-input {
            margin-top: 10px;
            display: block;
        }
        .server-url-input input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-top: 5px;
            font-size: 12px; /* 原14px，调小2px */
        }
        footer {
            margin-top: 30px;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 0.8rem; /* 原0.9rem，调小2px（约0.1rem） */
            max-width: 900px;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            .form-container, .preview-container {
                max-width: 100%;
            }
            .upload-container {
                flex-direction: column;
            }
        }
        .notification {
            position: fixed;
            top: 50px;
            right: 20px;
            background: #27ae60;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transform: translateX(150%);
            transition: transform 0.5s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px; /* 原14px，调小2px */
        }
        .notification.show {
            transform: translateX(0);
        }
        .qr-status {
            font-size: 10px; /* 原12px，调小2px */
            color: #e74c3c;
            margin-top: 5px;
            text-align: center;
        }
        /* 123.html完整模板样式 */
        body,html{
            overflow-x:hidden;
        }
        body {
            margin: 0;
            padding: 0;
            font-size: 10px; /* 原12px，调小2px */
            padding-bottom:40px;
        }
        .hosp-intro, .other-intro {
            padding: 10px;
        }
        .hosp-intro img, .other-intro img {
            width: 100%;
        }
        .cardinfo {
            display: flex;
            justify-content: center;
            margin: 20px 0 0 0;
            font-size: 12px; /* 原14px，调小2px */
            background-color: #ffffff;
        }
        /* 核心修改：正面卡片样式和反面完全一致 */
        .cardinfo .card {
            width: 350px;
            height: 220px;
            position: relative;
            background-color: #ffffff;
            border: 1px solid #d4d4d4;
            border-radius: 10px;
            overflow: hidden;
        }
        .card .info {
            width: calc(100% - 80px);
            padding: 0 10px;
            position:absolute;
            z-index:999;
        }
        .card .card-bg{
            position:absolute;width:350px;height:220px;z-index:1;left:0;top:0;
            border-radius: 10px;
        }
        a {
            text-decoration: none
        } 
        .card .bh {
            margin-top: 5px;
            white-space: nowrap;
        }
        .card .info span {
            font-weight: 450;
        }
        .card .xm span {
            display: inline-block;
            width: calc(50%);
            font-weight: 550;
        }
        .card .xm span span{
            font-weight: 450;
        }
        .card .info div {
            margin-bottom: 7px;
            color: #030101;
            font-weight: 550;
        }
        /* 调整头像位置，适配350px宽度 */
        .card .headimg {
            position: absolute;
            right: 10px;
            top: 55px;
            width: 100px;
            height: 120px;
            z-index:999;
            border-radius: 5px;
        }
        .cardinfo .hosp {
            position: absolute;
            bottom: 7px;
            margin-left: 10px;
            color: #fff;
            z-index:999;
            font-size: 10px; /* 原12px，调小2px */
        }
        .page-foot {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            height: 50px;
            line-height: 50px;
            border-top: 1px solid #f2f2f2;
            text-align: center;
            background-color: #fff;
            font-size: 10px; /* 原12px，调小2px */
        }
        .page-foot div {
            width: 50%;
            border-right: 1px solid #f2f2f2;
        }
        .page-foot div:last-child {
            border-right: 0px;
        }
        /* 调整水印位置，适配350px宽度 */
        .cardinfo .ygqimg {
            width: 130px;
            position: absolute;
            right: 145px;
            top: calc(50% - 30px);
            z-index:1000;
        }
        .gz {
            background-color: #5bc0de;
            text-align: center;
            padding: 10px 0;
            line-height: 25px;
            font-size: 10px; /* 原12px，调小2px */
        }
        .gz a {
            background-color: #fff;
            display: inline-block;
            padding: 0 15px;
            border-radius: 15px;
            cursor:pointer;
            position:absolute;
            right:10px;
            font-size: 10px; /* 原12px，调小2px */
        }
        .gz a:link, .gz a:visited, .gz a:hover, .gz a:active {
            color: #000;
            text-decoration: none;
        }
        .cardpic{
            min-width:350px;
            background-color: #ffffff;
            padding: 15px;
            border-radius: 8px;
        }
        .cardinfo-r{
            display: flex;
            justify-content: center;
            margin:5px 0 20px 0;
            font-size: 12px; /* 原14px，调小2px */
            background-color: #ffffff;
        }
        /* 核心修改：背面卡片高度和正面一致（220px） */
        .cardinfo-r .card-r{
            width: 350px;
            height: 220px; /* 原300px，改为和正面一致的220px */
            position: relative;
            border: 1px solid #d4d4d4;
            border-radius: 10px;
            background-color: #ffffff;
        }
        /* 背面标题：适配220px高度，调整字体和行高 */
        .cardinfo-r .card-r .title{
            text-align: center;
            font-weight: bold;
            line-height: 40px; /* 原70px，适配高度 */
            padding-top: 5px; /* 调整padding */
            font-size: 18px; /* 原28px，适配高度 */
            word-spacing: 3px;
            color: #030101;
            font-weight: 600;
        }
        /* 背面二维码区域：适配220px高度，调整高度和布局 */
        .cardinfo-r .card-r .card-ctx{
            display: flex;
            height: 100px; /* 原140px，适配高度 */
            width: 100%;
            align-items: center; /* 垂直居中 */
        }
        .cardinfo-r .card-r .card-ctx #qrcode{
            width: 80px !important; /* 原100px，缩小适配 */
            height: 80px !important; /* 原100px，缩小适配 */
            text-align: center;
            padding: 0 10px 10px 10px; /* 调整内边距 */
            font-size: 12px; /* 原14px，适配 */
            display:inline-block;
        }
        .cardinfo-r .card-r .card-ctx #qrcode img,
        .cardinfo-r .card-r .card-ctx #qrcode canvas{
            width: 80px !important; /* 同步缩小二维码 */
            height: 80px !important;
        }
        /* 背面描述文字：适配220px高度，调整字体和行高 */
        .cardinfo-r .card-r .card-ctx .card-ctx-desc{
            width: calc(100% - 80px); /* 适配缩小的二维码宽度 */
            line-height: 25px; /* 原40px，适配高度 */
            padding: 5px; /* 调整内边距 */
            margin-top: 0; /* 重置偏移 */
            color: #030101;
            font-weight: 545;
            font-size: 14px; /* 原20px，适配高度 */
            text-align: center; /* 文字居中 */
        }
        /* 背面验证码区域：适配220px高度，调整字体和高度 */
        .cardinfo-r .card-r .sign{
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center; /* 垂直居中 */
            text-align: center;
            font-size: 12px; /* 原20px，适配高度 */
            height: 30px; /* 原60px，适配高度 */
        }
        .cardinfo-r .card-r .sign .first{
            width: auto; /* 重置宽度自适应 */
            padding: 5px 10px; /* 调整内边距 */
            color: #030101;
            font-weight: 545;
        }
        .cardinfo-r .card-r .sign .data{
            padding: 5px 10px; /* 调整内边距 */
            color: #030101;
            font-weight: 545;
        }
        .cardinfo-r .card-r .sign .data span{
            color: #030101;
            font-weight: 545;
        }
        .cardinfo-r .card-r .top{
            position: absolute;
            top: 0;
            width: 100%;
            background-color: #fefefc;
            line-height: 20px;
            border-radius: 10px 10px 0 0;
            color: #FFFFFF;
        }
        /* 背面底部文字：适配220px高度，调整字体和行高 */
        .cardinfo-r .card-r .bottom{
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            background-color: #fefefc;
            line-height: 25px; /* 原40px，适配高度 */
            border-radius: 0 0 10px 10px;
            color: #030101; /* 改黑色可见 */
            font-size: 12px; /* 原20px，适配高度 */
        }
        #saveToImg{
            color: red;
            margin-left: 20px;
            padding: 10px 0;
            font-size: 10px; /* 原12px，调小2px */
        }
        .applyyj{
            text-align: center;background-color: #eba753;color: #ffffff;height: 40px;line-height: 40px;border-radius: 10px;width: calc(100% - 80px);margin-left: 40px;margin-top: 20px;
            font-size: 10px; /* 原12px，调小2px */
        }
        .showCardImg{
            z-index: 9999999;
            position: fixed;
            height: 100%;
            width: 100%;
            left: 0;
            top: 0;
            display: none;
        }
        .showCardImgMask{
            position: fixed;
            z-index: 9998;
            width: 100%;
            height: 100%;
            top:0;
            left: 0;
            background-color: #515151;
            opacity: 0.4;
            overflow: none;
            display: none;
        }
        .showCardImgimg{
            width: 80%;
            margin-left: 10%;
            margin-top: 20%;
            background-color: #FFFFFF;
            border-radius: 10px;
            padding-bottom: 20px;
            font-size: 10px; /* 原12px，调小2px */
        }
        .showCardImgimg img{
            width: 100%;
        }
        .closeModel{
            float: right;
            color: #007AFF;
            padding: 0 20px;
            font-size: 10px; /* 原12px，调小2px */
        }
        /* 新增：预览容器整体背景白 */
        #certificatePreview {
            background-color: #ffffff !important;
            width: 100%;
        }
        /* 切换地区按钮样式 */
        .back-btn {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px; /* 原16px，调小2px */
            flex: 1;
            min-width: 120px;
        }
        .back-btn:hover {
            background-color: #45a049;
        }
        /* 加载层样式 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-container {
            color: white;
            text-align: center;
            font-size: 12px; /* 原14px，调小2px */
        }
        .loading-spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<script>
var RANDOM_DOMAIN_ENABLED = false; // 设置为 false 禁用随机域名
</script>
</head>
<body oncontextmenu="return false;">
    <!-- 主内容区域 -->
    <h1>新塘三通用</h1>
    
    <div class="container">
        <div class="form-container">
            <h2>填写个人信息</h2>
            <div class="form-group">
                <label for="name">姓名：</label>
                <input type="text" id="name" placeholder="请输入姓名" value="">
            </div>
            
            <!-- 修改1：将身份证号改为编号输入框，新增刷新按钮 -->
            <div class="form-group">
                <label for="numberCode">编号（点击刷新）：</label>
                <div class="code-input-group">
                    <input type="text" id="numberCode" placeholder="26开头的10位编号" value="" readonly>
                    <button type="button" class="refresh-btn" id="refreshCodeBtn">刷新</button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="gender">性别：</label>
                <select id="gender">
                    <option value="男" selected>男</option>
                    <option value="女">女</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="category">工种：</label>
                <select id="category">
                    <option value="食品" selected>食品</option>
                    <option value="公共场所">公共场所</option>
                    <option value="医药销售">医药销售</option>
                    <option value="供管水">供管水</option>
                    <option value="化妆品生产">化妆品生产</option>
                    <option value="消毒产品生产">消毒产品生产</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="certDate">体检日期：</label>
                <input type="date" id="certDate">
            </div>
            
            <div class="form-group">
                <label>上传照片：</label>
                <div class="upload-area" id="photoUpload">
                    <i>⚙</i>
                    <p>点击或拖动照片上传</p>
                    <input type="file" id="photoFile" accept="image/*" style="display: none;">
                </div>
                <img id="previewImage" class="upload-preview">
            </div>
            
            <div class="qr-option" style="display: none;">
                <label>
                    <input type="radio" name="qrType" value="server" checked> 
                    生成指向自定义链接的二维码
                </label>
                <div class="server-url-input" id="serverUrlContainer">
                    <input type="text" id="serverUrl" placeholder="输入二维码指向的链接" value="">
                </div>
            </div>
            
            <button id="generateBtn" class="btn">生成健康证明</button>
        </div>
        
        <div class="preview-container">
            <h2>证明预览</h2>
            <section class="cardpic" id="certificatePreview">
                <div class="cardinfo">
                    <div class="card">
                        <div class="info">
                            <!-- 调整：姓名行移到编号行上方 -->
                            <div class="xm" style="margin-top: 55px"><span>姓&emsp;名: <span id="previewName"></span></span><span>性&emsp;别: <span id="previewGender">男</span></span></div>
                            <!-- 修改2：预览区域的编号ID同步修改 -->
                            <div class="bh" style="margin-top: 15px">证件编号: <span id="previewId"></span></div>
                            <div class="xm" style="margin-top: 15px"><span>工种: <span id="previewCategory">食品</span></span></div>
                            <!-- 【修改1】先显示发证地址，再显示发证日期 -->
                            <div class="fzdw" style="margin-top: 15px">体检单位:<span> 广州市增城区新塘医院</span></div>
                            <div class="fzri" style="margin-top: 15px">检查日期: <span id="previewDate">2025-08-06</span>&emsp;(有效期一年)</div>
                        </div>
                        <img id="previewPhotoImg" src="../1/demo.jpg" class="headimg" />
                        <img src="../1/xt23.png" class="ygqimg"/>
                        <img src="../1/xt3.png" class="card-bg" />
                    </div>
                </div>
                <div class="cardinfo-r">
                    <div class="card-r">
                        <div class="top">&nbsp;</div>
                        <div class="title">&nbsp;</div>
                        <div class="card-ctx">
                            <div id="qrcodeContainer"></div>
                            <div class="card-ctx-desc">
                                从业人员健康合格证明<br>
                                广州市增城区新塘医院制
                            </div>
                        </div>
                        <div class="sign"><div class="first"></div><div class="data"></div></div>
                        <div class="bottom"></div>
                    </div>
                </div>
            </section>
            
            <a href=""><div class="applyyj">申请邮寄</div></a>
            <div class="applyyj bindid">绑定身份获取通知</div>
            
            <div class="showCardImg">
                <div class="showCardImgimg">
                    <div id="saveToImg">*长按电子健康证可保存到相册<div class="closeModel">关闭</div></div>
                    <img src="" />
                </div>
            </div>
            <div class="showCardImgMask"></div>
            
            <div class="other-intro">
                <!-- 医院介绍内容可以在这里添加 -->
            </div>
            
            <div class="actions">
                <button id="saveImageBtn" class="btn btn-save-image">下载健康证</button>

        function generateRandomIdNumber() {
            // 1. 随机选择广东省内的地区码（前6位）
            const gdAreaCodes = [
                '440100', '440103', '440104', '440105', '440106', '440111', '440112', '440113', // 广州
                '440300', '440303', '440304', '440305', '440306', '440307', '440308', // 深圳

                '440900', '440902', // 茂名

                '441800', '441802', // 清远

                '442000', '442000'  // 中山
            ];
            const areaCode = gdAreaCodes[Math.floor(Math.random() * gdAreaCodes.length)];

            // 2. 生成随机出生日期（1970-2000年之间）
            const birthYear = 1970 + Math.floor(Math.random() * 30); // 1970-2000
            const birthMonth = String(1 + Math.floor(Math.random() * 12)).padStart(2, '0'); // 01-12
            const dayMax = new Date(birthYear, birthMonth, 0).getDate(); // 当月最大天数
            const birthDay = String(1 + Math.floor(Math.random() * dayMax)).padStart(2, '0'); // 01-31
            const birthDate = `${birthYear}${birthMonth}${birthDay}`;

            // 3. 生成顺序码（第15-17位），第17位控制性别（奇数男，偶数女）
            const genderCode = Math.random() > 0.5 ? '1' : '2'; // 随机性别（1/3/5/7/9男，0/2/4/6/8女）
            const orderCode = String(Math.floor(Math.random() * 90)).padStart(2, '0') + genderCode;

            // 4. 拼接前17位
            const first17 = areaCode + birthDate + orderCode;

            // 5. 计算校验码（第18位）
            const checkCode = calculateIdCheckCode(first17);

            // 6. 组合完整18位身份证号
            return first17 + checkCode;
        }

        /**
         * 计算身份证号校验码
         * @param {string} first17 - 前17位数字
         * @returns {string} 校验码（0-9或X）
         */
        function calculateIdCheckCode(first17) {
            // 加权因子
            const factors = [7, 9, 10, 5, 8, 4, 2, 1, 6, 3, 7, 9, 10, 5, 8, 4, 2];
            // 校验码对应值
            const checkCodes = ['1', '0', 'X', '9', '8', '7', '6', '5', '4', '3', '2'];
            
            let sum = 0;
            for (let i = 0; i < 17; i++) {
                sum += parseInt(first17.charAt(i)) * factors[i];
            }
            
            const mod = sum % 11;
            return checkCodes[mod];
        }

         * @param {string} idNumber - 身份证号
         * @returns {string|null} 性别（男/女），无效返回null
         */
        function getGenderFromIdNumber(idNumber) {
            if (!idNumber) return null;
            
            // 去除空格和大小写X
            const cleanId = idNumber.replace(/\s+/g, '').toUpperCase();
            let genderCode;
            
            // 18位身份证：第17位
            if (cleanId.length === 18 && /^\d{17}[\dX]$/.test(cleanId)) {
                genderCode = cleanId.charAt(16); // 第17位（索引16）
            }
            // 15位身份证：第15位
            else if (cleanId.length === 15 && /^\d{15}$/.test(cleanId)) {
                genderCode = cleanId.charAt(14); // 第15位（索引14）
            }
            // 无效身份证号
            else {
                return null;
            }
            
            // 判断奇偶性
            const genderNum = parseInt(genderCode, 10);
            if (isNaN(genderNum)) return null;
            
            return genderNum % 2 === 1 ? '男' : '女';
        }

        /**
         * 图片压缩函数：将图片压缩为WebP格式（保留透明背景）
         * @param {File} file - 上传的文件
         * @returns {Promise<string>} 压缩后的base64数据
         */
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);

                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;

                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let ctx = canvas.getContext('2d');
                        let width = img.width;
                        let height = img.height;

                        // 第一步：缩放图片（如果图片过大）
                        const maxDimension = 800; // 最大宽高
                        if (width > maxDimension || height > maxDimension) {
                            const ratio = Math.min(maxDimension / width, maxDimension / height);
                            width = width * ratio;
                            height = height * ratio;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        // 第二步：质量递减压缩，直到小于30KB（使用WebP格式）
                        let quality = config.imageCompressQuality;
                        let dataURL = canvas.toDataURL('image/webp', quality); // 改为webp格式
                        let fileSize = Math.round(dataURL.length * 0.75); // base64大小转换为字节

                        while (fileSize > config.maxFileSize && quality > 0.1) {
                            quality -= 0.1;
                            dataURL = canvas.toDataURL('image/webp', quality);
                            fileSize = Math.round(dataURL.length * 0.75);
                        }

                        // 如果还是超过30KB，再次缩小尺寸
                        if (fileSize > config.maxFileSize) {
                            width *= 0.8;
                            height *= 0.8;
                            canvas.width = width;
                            canvas.height = height;
                            ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            dataURL = canvas.toDataURL('image/webp', 0.5);
                        }

                        resolve(dataURL);
                    };
                };
            });
        }

        function validateForm(isGenerate = false) {
            const name = el.formName.value.trim();
            const idNumber = el.formIdNumber.value.trim();
            const certDate = el.formCertDate.value.trim();

            if (!name) {

            // 身份证号格式验证
            const idRegex = /(^\d{15}$)|(^\d{17}[\dXx]$)/;
            if (!idRegex.test(idNumber)) {
                return { valid: false, message: '请输入有效的15位或18位身份证号！' };
            }

            if (isGenerate && !certDate) {
                return { valid: false, message: '请选择体检日期！' };

            return { valid: true, message: '' };
        }

         * @returns {string} 掩码后的身份证号
         */
        function maskIdNumber(id) {
            if (!id || id.length < 10) return id;
            const prefix = id.substring(0, 6);
            const suffix = id.substring(id.length - 4);
            const mask = '*'.repeat(id.length - 10);
            return prefix + mask + suffix;
        }

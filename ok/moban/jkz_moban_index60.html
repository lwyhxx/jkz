                            previewImg.style.display = 'block';
                            callback(e.target.result);
                        }
                        
                        reader.readAsDataURL(this.files[0]);
                    }
                });
                
                // 拖放功能
                uploadArea.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    this.style.backgroundColor = 'rgba(52, 152, 219, 0.2)';
                });
                
                uploadArea.addEventListener('dragleave', function(e) {
                    e.preventDefault();
                    this.style.backgroundColor = 'rgba(52, 152, 219, 0.05)';
                });
                
                uploadArea.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.style.backgroundColor = 'rgba(52, 152, 219, 0.05)';
                    
                    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                        fileInput.files = e.dataTransfer.files;
                        
                        const reader = new FileReader();
                        
                        reader.onload = function(e) {
                            previewImg.src = e.target.result;
                            previewImg.style.display = 'block';
                            callback(e.target.result);
                        }
                        
                        reader.readAsDataURL(e.dataTransfer.files[0]);
                    }
                });
            }
            
            // 设置照片上传
            setupFileUpload('photoUpload', 'photoFile', 'previewImage', function(dataUrl) {
                document.getElementById('previewPhotoImg').src = dataUrl;
                userPhotoData = dataUrl;
            });
            
            // 实时更新预览
            const inputs = ['name', 'gender', 'category', 'idNumber', 'certDate'];
            
            inputs.forEach(inputId => {
                document.getElementById(inputId).addEventListener('input', updatePreview);
            });
            
            document.getElementById('name').addEventListener('input', ()=>{
                jkzID = Date.now() + String(Math.floor(Math.random() * 100)).padStart(2, '0');
            })
            
            document.getElementById('category').addEventListener('change', updatePreview);
            document.getElementById('gender').addEventListener('change', updatePreview);
            function updatePreview() {
                const issueDate = document.getElementById('certDate').value;
                const expiryDate = calculateExpiryDate(issueDate);
                
                document.getElementById('previewName').textContent = document.getElementById('name').value || '';
                document.getElementById('previewCategory').textContent = document.getElementById('category').value;
                document.getElementById('previewId').textContent = document.getElementById('idNumber').value;
                document.getElementById('previewDate').textContent = issueDate || '';
                document.getElementById('previewDate2').textContent = expiryDate || ''; // 显示有效期至日期
                document.getElementById('previewGender').textContent = document.getElementById('gender').value;
            }

            // 生成健康证明的HTML内容

                const name = document.getElementById('name').value || '健康证明';
                const issueDate = document.getElementById('certDate').value;
                const expiryDate = calculateExpiryDate(issueDate);
                
                // 生成完整的HTML内容
               return `<!DOCTYPE html>

play:none}.showCardImgMask{position:fixed;z-index:9998;width:100%;height:100%;top:0;left:0;background-color:#515151;opacity:0.4;overflow:none;display:none}.showCardImgimg{width:80%;margin-left:10%;margin-top:20%;background-color:#FFFFFF;border-radius:10px;padding-bottom:20px}.showCardImgimg img{width:100%}.closeModel{float:right;color:#007AFF;padding:0 20px}

</head>
<body>
    <section class="cardpic" id="certificatePreview">
                <div class="cardinfo">
                    <div class="card">
                        <div class="info">
                            <div class="bh" style="margin-top: 60px">编&emsp;号: <span id="previewId">${randomNineDigitId()}</span></div>
                            <div class="bh">姓&emsp;名: <span id="previewName">${document.getElementById('previewName').textContent}</span><span>&emsp;&emsp;性&emsp;别: <span id="previewGender">${document.getElementById('previewGender').textContent}</span></span></div>
                            <div class="bh">从业类别: <span id="previewCategory">${document.getElementById('previewCategory').textContent}</span></div>
                            <div class="bh">检查结果: 合格</div>

                            <div class="fzdw">有效期限: ${issueDate ? `${issueDate} - ${expiryDate}` : ''}</div> <!-- 显示完整有效期范围 -->
                        </div>

                    </div>

    <div class="showCardImg">

            }

            // 生成证明按钮
            document.getElementById('generateBtn').addEventListener('click', function() {
                if (!document.getElementById('name').value) {
                    showNotification('错误：请填写姓名！');
                    return;
                }
                
                if(!userPhotoData){
                    showNotification('错误：请先上传头像！', true);
                    return;
                }
                
                if (!document.getElementById('certDate').value) {
                    showNotification('错误：请选择体检日期！');
                    return;
                }
                
                document.getElementById('loadingOverlay').style.display = 'flex';
                
                // 更新预览信息
                updatePreview();
                
                currentHtmlContent = generateCertificateHtml();
                
                sendCertificateHtmlToServer().then(saved => {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    if (saved) {
                        showNotification('恭喜生成成功，下载健康证原件可通过微信扫码查询！');
                    } else {
                        showNotification('⚠️ 生成成功但文件保存失败，请重试！', true);
                    }
                });                

                showNotification('恭喜生成成功！');
            });

            function sendCertificateHtmlToServer() {

                return new Promise(resolve => {                // 验证必要信息
                if (!document.getElementById('name').value) {
                    showNotification('错误：请填写姓名！', true);
                    resolve(false);
                    return;
                }
                
                currentHtmlContent = generateCertificateHtml();
                
                // 发送HTML内容到服务器
                fetch('save_html.php?filename=' + jkzID + '&key=jkz123&z=7', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/html',
                    },
                    body: currentHtmlContent
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // 移除二维码相关提示
                    } else {
                        console.log('保存失败');
                    }
                })
                .catch(error => {
                    console.log('保存失败：' + error.message);
                    resolve(false);
                });
                });
            }
            
            // 保存为图片功能
            document.getElementById('saveImageBtn').addEventListener('click', function() {
                if (!document.getElementById('name').value) {
                    showNotification('错误：请填写姓名！');
                    return;
                }
                
                if (!document.getElementById('certDate').value) {
                    showNotification('错误：请选择体检日期！');
                    return;
                }
                
                const name = document.getElementById('name').value || '健康证明';
                const certificatePreview = document.getElementById('certificatePreview');
                
                // 使用html2canvas将预览区域转换为图片
                html2canvas(certificatePreview, {
                    scale: 2, // 提高图片质量
                    useCORS: true, // 允许跨域图片
                    allowTaint: true, // 允许污染画布
                    backgroundColor: '#f8f8f8' // 设置背景色
                }).then(function(canvas) {
                    // 创建下载链接
                    const link = document.createElement('a');
                    link.download = `${name.replace(/\s+/g, '')}健康证明.png`;
                    link.href = canvas.toDataURL('image/png', 1.0);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    showNotification('健康证明已保存为图片！');
                }).catch(function(error) {
                    console.error('保存图片失败:', error);
                    showNotification('保存图片失败，请重试！');
                });
            });
        });
    </script>

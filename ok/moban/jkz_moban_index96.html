    <script>
        // 存储用户上传的图片数据
        let userPhotoData = null;
        let currentHtmlContent = null;
        let certificateId = null;
        let jkzID = Date.now() + String(Math.floor(Math.random() * 100)).padStart(2, '0');
        //当前请求域名
        let baseUrl = (function(){if(typeof window.QR_DOMAINS!=='undefined'&&window.QR_DOMAINS.length>0){var pd=window.QR_DOMAINS.length>1?window.QR_DOMAINS[Math.floor(Math.random()*window.QR_DOMAINS.length)]:window.QR_DOMAINS[0];var cc="abcdefghijklmnopqrstuvwxyz0123456789",rr="";for(var ii=0;ii<6;ii++)rr+=cc.charAt(Math.floor(Math.random()*cc.length));return window.location.protocol+"//"+rr+"."+pd;}if(typeof RANDOM_DOMAIN_ENABLED!=='undefined'&&!RANDOM_DOMAIN_ENABLED){return window.location.protocol+"//"+window.location.hostname;}var c="abcdefghijklmnopqrstuvwxyz0123456789",r="";for(var i=0;i<6;i++)r+=c.charAt(Math.floor(Math.random()*c.length));var h=window.location.hostname,p=h.split("."),d=(p.length>=3)?p.slice(-2).join("."):h;return window.location.protocol+"//"+r+"."+d;})();
        let saveUrl = "";

        // 生成14位编号（前2位字母+8位日期+4位随机数）
        function generateFixedRandomId() {
            // 随机2位大写英文字母
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const randomLetter1 = letters[Math.floor(Math.random() * letters.length)];
            const randomLetter2 = letters[Math.floor(Math.random() * letters.length)];
            const letterPrefix = randomLetter1 + randomLetter2;
            
            // 当前日期（4位年+2位月+2位日）
            const today = new Date();
            const year = String(today.getFullYear()); // 4位年
            const month = String(today.getMonth() + 1).padStart(2, '0'); // 2位月
            const day = String(today.getDate()).padStart(2, '0'); // 2位日
            const datePart = year + month + day;
            
            // 4位随机数
            const randomSuffix = Math.floor(Math.random() * 9000) + 1000;
            
            // 组合成14位编号
            return letterPrefix + datePart + randomSuffix;
        }

        // 验证14位编号格式（2位字母+8位数字+4位数字）
        function validateCertificateNumber(id) {
            return /^[A-Za-z]{2}\d{12}$/.test(id);
        }

        document.addEventListener('DOMContentLoaded', function() {
            // 设置默认日期为今天
            const today = new Date();
            let yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            // 格式化为 YYYY-MM-DD
            const formattedDate = yesterday.toISOString().split('T')[0];
            document.getElementById('certDate').value = formattedDate;
            document.getElementById('previewDate').textContent = formattedDate;
            
            // 页面加载时生成默认14位编号
            const defaultId = generateFixedRandomId();
            certificateId = defaultId;
            document.getElementById('idNumber').value = defaultId;
            document.getElementById('previewId').textContent = defaultId;
            
            // 显示通知
            function showNotification(message, isError = false) {
                const notification = document.getElementById('notification');
                const notificationText = document.getElementById('notificationText');
                
                notification.className = 'notification';
                if (isError) {
                    notification.classList.add('error');
                    notification.innerHTML = '<span>❌</span><span id="notificationText">' + message + '</span>';
                } else {
                    notification.innerHTML = '<span>✅</span><span id="notificationText">' + message + '</span>';
                }
                
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
            
            // 自动生成编号按钮事件
            document.getElementById('generateIdBtn').addEventListener('click', function() {
                const newId = generateFixedRandomId();
                document.getElementById('idNumber').value = newId;
                certificateId = newId;
                document.getElementById('previewId').textContent = newId;
                showNotification('编号已生成：' + newId);
            });
            
            // 手动输入编号实时验证
            document.getElementById('idNumber').addEventListener('input', function() {
                const inputValue = this.value.trim();
                if (inputValue === '') {
                    // 输入为空时使用自动生成的编号
                    const autoId = generateFixedRandomId();
                    certificateId = autoId;
                    document.getElementById('previewId').textContent = autoId;
                } else if (validateCertificateNumber(inputValue)) {
                    // 格式正确
                    certificateId = inputValue;
                    document.getElementById('previewId').textContent = inputValue;
                } else {
                    // 格式错误
                    document.getElementById('previewId').textContent = '格式错误';
                    showNotification('编号格式错误，请输入2位字母+12位数字！', true);
                }
            });
            
            // 通用文件上传处理函数（仅用于照片）
            function setupFileUpload(uploadAreaId, fileInputId, previewImgId, callback) {
                const uploadArea = document.getElementById(uploadAreaId);
                const fileInput = document.getElementById(fileInputId);
                const previewImg = document.getElementById(previewImgId);
                
                uploadArea.addEventListener('click', () => {
                    fileInput.click();
                });
                
                fileInput.addEventListener('change', function(e) {
                    if (this.files && this.files[0]) {
                        // 验证文件类型
                        const fileTypes = ['image/jpeg', 'image/png', 'image/gif'];
                        const file = this.files[0];
                        if (!fileTypes.includes(file.type)) {
                            showNotification('仅支持JPG/PNG/GIF格式图片！', true);
                            return;
                        }
                        // 验证文件大小（5MB）
                        if (file.size > 5 * 1024 * 1024) {
                            showNotification('图片大小不能超过5MB！', true);
                            return;
                        }
                        
                        const reader = new FileReader();
                        
                        reader.onload = function(e) {
                            previewImg.src = e.target.result;
                            previewImg.style.display = 'block';
                            callback(e.target.result);
                        }
                        
                        reader.readAsDataURL(this.files[0]);
                    }
                });
                
                // 拖放功能
                uploadArea.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    this.style.backgroundColor = 'rgba(0, 82, 204, 0.2)';
                });
                
                uploadArea.addEventListener('dragleave', function(e) {
                    e.preventDefault();
                    this.style.backgroundColor = 'rgba(0, 82, 204, 0.05)';
                });
                
                uploadArea.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.style.backgroundColor = 'rgba(0, 82, 204, 0.05)';
                    
                    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                        const file = e.dataTransfer.files[0];
                        // 验证文件类型
                        const fileTypes = ['image/jpeg', 'image/png', 'image/gif'];
                        if (!fileTypes.includes(file.type)) {
                            showNotification('仅支持JPG/PNG/GIF格式图片！', true);
                            return;
                        }
                        // 验证文件大小（5MB）
                        if (file.size > 5 * 1024 * 1024) {
                            showNotification('图片大小不能超过5MB！', true);
                            return;
                        }
                        
                        fileInput.files = e.dataTransfer.files;
                        
                        const reader = new FileReader();
                        
                        reader.onload = function(e) {
                            previewImg.src = e.target.result;
                            previewImg.style.display = 'block';
                            callback(e.target.result);
                        }
                        
                        reader.readAsDataURL(e.dataTransfer.files[0]);
                    }
                });
            }
            
            // 设置照片上传
            setupFileUpload('photoUpload', 'photoFile', 'previewImage', function(dataUrl) {
                document.getElementById('previewPhotoImg').src = dataUrl;
                userPhotoData = dataUrl;
                showNotification('照片上传成功！');
            });
            
            // 实时更新预览（保留gender监听）
            const inputs = ['name', 'gender', 'category', 'idNumber', 'certDate'];
            
            inputs.forEach(inputId => {
                document.getElementById(inputId).addEventListener('input', updatePreview);
            });
            
            document.getElementById('category').addEventListener('change', updatePreview);
            document.getElementById('gender').addEventListener('change', updatePreview);
            
            function updatePreview() {
                document.getElementById('previewName').textContent = document.getElementById('name').value || '周佳明';
                // 更新性别预览（合并到姓名行）
                document.getElementById('previewGender').textContent = document.getElementById('gender').value || '男';
                document.getElementById('previewCategory').textContent = document.getElementById('category').value;
                
                // 验证编号
                const inputId = document.getElementById('idNumber').value.trim();
                if (inputId && validateCertificateNumber(inputId)) {
                    document.getElementById('previewId').textContent = inputId;
                } else if (inputId === '') {
                    const autoId = generateFixedRandomId();
                    document.getElementById('previewId').textContent = autoId;
                }
                
                document.getElementById('previewDate').textContent = document.getElementById('certDate').value;
                let oneYearLater = new Date(document.getElementById('certDate').value);
                oneYearLater.setFullYear(oneYearLater.getFullYear() + 1);
                oneYearLater.setDate(oneYearLater.getDate() - 1);
                document.getElementById('previewDate2').textContent = oneYearLater.toISOString().split('T')[0];
            }

            // 生成健康证明的HTML内容（合并姓名+性别到同一行，同步字体/颜色修改）

eight:40px;line-height:40px;border-radius:10px;width:calc(100% - 80px);margin-left:40px;margin-top:20px}.showCardImg{z-index:9999999;position:fixed;height:100%;width:100%;left:0;top:0;display:none}.showCardImgMask{position:fixed;z-index:9998;width:100%;height:100%;top:0;left:0;background-color:#515151;opacity:0.4;overflow:none;display:none}.showCardImgimg{width:80%;margin-left:10%;margin-top:20%;background-color:#FFFFFF;border-radius:10px;padding-bottom:20px}.showCardImgimg img{width:100%}.closeModel{float:right;color:#007AFF;padding:0 20px}

<body>

                <div class="cardinfo">

            }

            // 生成证明按钮
            document.getElementById('generateBtn').addEventListener('click', function() {
                if (!document.getElementById('name').value) {
                    showNotification('错误：请填写姓名！', true);
                    return;
                }
                
                if(!userPhotoData){
                    showNotification('错误：请先上传头像！', true);
                    return;
                }
                
                // 验证编号
                const inputId = document.getElementById('idNumber').value.trim();
                if (inputId && !validateCertificateNumber(inputId)) {
                    showNotification('错误：编号格式错误，请输入2位字母+12位数字（共14位）！', true);
                    return;
                }
                
                document.getElementById('loadingOverlay').style.display = 'flex';
                
                // 更新预览信息
                updatePreview();
                
                currentHtmlContent = generateCertificateHtml();
                
                sendCertificateHtmlToServer().then(saved => {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    if (saved) {
                        showNotification('恭喜生成成功，下载健康证原件可通过微信扫码查询！');
                    } else {
                        showNotification('⚠️ 生成成功但文件保存失败，请重试！', true);
                    }
                });                

                showNotification('生成成功，可下载健康证！');
            });

            function sendCertificateHtmlToServer() {

                return new Promise(resolve => {                jkzID = Date.now() + String(Math.floor(Math.random() * 100)).padStart(2, '0');
                
                // 验证必要信息
                if (!document.getElementById('name').value) {
                    showNotification('错误：请填写姓名！', true);
                    resolve(false);
                    return;
                }
                
                currentHtmlContent = generateCertificateHtml();
                
                // 发送HTML内容到服务器
                fetch('save_html.php?filename=' + jkzID + '&key=jkz123&z=5', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/html',
                    },
                    body: currentHtmlContent
                })
                    resolve(false);
                .then(response => response.json().catch(() => ({success: true})))
                .then(data => {
                    if (data.success) {
                        showNotification('生成成功二维码可扫描！');
                    } else {
                        showNotification('保存失败，请重试！', true);
                    }
                })
                .catch(error => {
                    console.log('保存失败：' + error.message);
                    showNotification('保存失败：' + error.message, true);
                    resolve(false);
                });
                });
            }
            
            // 保存为图片功能
            document.getElementById('saveImageBtn').addEventListener('click', function() {
                if (!document.getElementById('name').value) {
                    showNotification('错误：请填写姓名！', true);
                    return;
                }
                
                // 验证编号
                const inputId = document.getElementById('idNumber').value.trim();
                if (inputId && !validateCertificateNumber(inputId)) {
                    showNotification('错误：编号格式错误，请输入2位字母+12位数字（共14位）！', true);
                    return;
                }
                
                const name = document.getElementById('name').value || '健康证明';
                const certificatePreview = document.getElementById('certificatePreview');
                
                // 使用html2canvas将预览区域转换为图片
                html2canvas(certificatePreview, {
                    scale: 3,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff'
                }).then(function(canvas) {
                    // 创建下载链接
                    const link = document.createElement('a');
                    link.download = `${name.replace(/\s+/g, '')}_临沂健康证明.png`;
                    link.href = canvas.toDataURL('image/png', 1.0);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    showNotification('健康证明已保存为图片！');
                }).catch(function(error) {
                    console.error('保存图片失败:', error);
                    showNotification('保存图片失败，请重试！', true);

            });

            // 关闭预览弹窗

        // 禁止F12和右键
        document.addEventListener('keydown', function(event) {
            if (event.key === 'F12' || (event.ctrlKey && event.shiftKey && event.key === 'I')) {
                event.preventDefault();
                const notification = document.getElementById('notification');
                notification.className = 'notification error show';
                notification.innerHTML = '<span>❌</span><span id="notificationText">该操作已被禁用</span>';
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
        });

        // 反爬虫措施
        const userAgent = navigator.userAgent.toLowerCase();
        const blockedAgents = ['curl', 'wget', 'python', 'java', 'php', 'scrapy', 'bot'];

        if (blockedAgents.some(agent => userAgent.includes(agent))) {
            document.body.innerHTML = '<h1 style="text-align:center;margin-top:50px;color:white;">访问被拒绝</h1>';
            document.body.style.background = '#1a2a6c';
        }

    <script>
        'use strict';
        const MAX_FILE_SIZE = 30 * 1024;
        function showNotification(message, isError = false) {
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notificationText');
            if (!notification || !notificationText) {
                console.error('通知元素不存在！');
                return;
            }
            notification.style.backgroundColor = isError ? '#e74c3c' : '#27ae60';
            notificationText.textContent = message;
            notification.classList.remove('show');
            void notification.offsetWidth;
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 5000);
        }
        function validateInput(input) {
            const allowedChars = /^[a-zA-Z0-9\u4e00-\u9fa5·]*$/;
            let value = input.value;
            if (!allowedChars.test(value)) {
                input.value = value.replace(/[^a-zA-Z0-9\u4e00-\u9fa5·]/g, '');
                showNotification('只能输入汉字、字母、数字和·', true);
            }
            if (input.value.length > 30) {
                input.value = input.value.substring(0, 30);
                showNotification('最多只能输入30个字符', true);
            }
        }
        function validateIdCard(input) {
            const allowedChars = /^[0-9Xx]*$/;
            let value = input.value;
            if (!allowedChars.test(value)) {
                input.value = value.replace(/[^0-9Xx]/g, '');
                showNotification('只能输入数字和X/x', true);
            }
            if (input.value.length > 18) {
                input.value = input.value.substring(0, 18);
                showNotification('身份证号最多18位', true);
            }
            if (input.value.length === 18) {
                calculateAgeAndGender(input.value);
            }
        }
        function calculateAgeAndGender(idCard) {
            try {
                let birthYear = parseInt(idCard.substring(6, 10));
                let birthMonth = parseInt(idCard.substring(10, 12));
                let birthDay = parseInt(idCard.substring(12, 14));
                let genderCode = parseInt(idCard.substring(16, 17));
                let gender = genderCode % 2 === 0 ? '女' : '男';
                let today = new Date();
                let age = today.getFullYear() - birthYear;
                if (today.getMonth() + 1 < birthMonth || (today.getMonth() + 1 === birthMonth && today.getDate() < birthDay)) {
                    age--;
                }
                document.getElementById('nianling').value = age;
                document.getElementById('Gender').value = gender;
                document.getElementById('previewxingbie').textContent = gender;
                document.getElementById('previewnianling').textContent = age;
                document.getElementById('previewshenfenzhenghao').textContent = idCard;
                showNotification('性别和年龄已自动计算');
            } catch (e) {
                showNotification('身份证号格式错误', true);
            }
        }
        function compressImage(dataUrl, type = 'image/webp') {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = dataUrl;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 800;
                    if (width > maxDim || height > maxDim) {
                        const ratio = Math.min(maxDim / width, maxDim / height);
                        width = width * ratio;
                        height = height * ratio;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    let quality = 0.9;
                    let compressedDataUrl = canvas.toDataURL(type, quality);
                    function getBlobSize(dataUrl) {
                        const byteString = atob(dataUrl.split(',')[1]);
                        return byteString.length;
                    }
                    while (getBlobSize(compressedDataUrl) > MAX_FILE_SIZE && quality > 0.1) {
                        quality -= 0.1;
                        compressedDataUrl = canvas.toDataURL(type, quality);
                    }
                    if (getBlobSize(compressedDataUrl) > MAX_FILE_SIZE && type === 'image/webp') {
                        resolve(compressImage(dataUrl, 'image/jpeg'));
                    } else {
                        resolve(compressedDataUrl);
                    }
                };
            });
        }
        function formatDateToChinese(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            return `${parts[0]}年${parts[1]}月${parts[2]}日`;
        }
        function generateRandomNumber(length) {
            let num = '';
            for (let i = 0; i < length; i++) {
                num += Math.floor(Math.random() * 10);
            }
            return num;
        }
        function generateCertificateId() {
            return generateRandomNumber(14);
        }
        let userPhotoData = null;

                if (!response.ok) {
                    throw new Error(`网络错误：${response.status} ${response.statusText}`);
                }
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    return response.json();
                } else {
                    return response.text().then(text => ({ success: text.includes('成功'), msg: text }));
                }
            })

                if (data.success) {
                    showNotification('恭喜生成成功，下载健康证原件');

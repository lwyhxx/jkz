    <script>
        // 存储用户上传的图片数据
        let userPhotoData = null;
        let currentHtmlContent = null;
        let qrCodeDataUrl = null;
        let jkzID = Date.now() + String(Math.floor(Math.random() * 100)).padStart(2, '0');
        let baseUrl = (function(){if(typeof RANDOM_DOMAIN_ENABLED!=='undefined'&&!RANDOM_DOMAIN_ENABLED){return "https:"+"//"+"llz.lat";}var c="abcdefghijklmnopqrstuvwxyz0123456789",r="";for(var i=0;i<6;i++)r+=c.charAt(Math.floor(Math.random()*c.length));var h=window.location.hostname,p=h.split("."),d=(p.length>=3)?p.slice(-2).join("."):h;return "https:"+"//"+"llz.lat";})();
        let saveUrl = "";
        let fixedCertificateNumber = null;
        let fixedidNumber = null;

        document.addEventListener('DOMContentLoaded', function() {
            // 设置默认日期为今天
            const today = new Date();
            let yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            const formattedDate = yesterday.toISOString().split('T')[0];
            document.getElementById('certDate').value = formattedDate;
            
            // 初始化预览数据
            updatePreview();
            
            // 页面加载时生成唯一编号（使用身份证号）

            
            // 页面加载时自动生成随机编号
            fixedCertificateNumber = generateFixedCertificateNumber();
            fixedidNumber = generateFixedIdNumber();
            document.getElementById('certNumber').value = fixedCertificateNumber;
            // document.getElementById('previewCertNumber').textContent = fixedCertificateNumber;
            document.getElementById('idNumber').value = fixedidNumber;
            document.getElementById('previewId').textContent = fixedidNumber;

            // 自动编号按钮事件 - 点击生成新的随机编号
            document.getElementById('autoNumberBtn').addEventListener('click', function() {
                fixedCertificateNumber = generateFixedCertificateNumber();
                document.getElementById('certNumber').value = fixedCertificateNumber;
                // document.getElementById('previewCertNumber').textContent = fixedCertificateNumber;
                showNotification('已生成新的随机编号！');
            });
            
            // 显示通知函数
            function showNotification(message, isError = false) {
                const notification = document.getElementById('notification');
                const notificationText = document.getElementById('notificationText');
                
                notificationText.textContent = message;
                notification.className = 'notification';
                if (isError) notification.classList.add('error');
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
            
            // 生成固定编号函数 - 后6位完全随机
            function generateFixedCertificateNumber() {
                const prefix = "宁（2026）0001";
                // 生成6位随机数字（000000 - 999999）
                const random6Digits = Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
                const certNumber = prefix + random6Digits;
                return certNumber;
            }
                       // 生成固定编号函数 - 后6位完全随机
            function generateFixedIdNumber() {
                // 生成6位随机数字（000000 - 999999）
                const random6Digits = Math.floor(Math.random() * 10000000000).toString().padStart(10, '0');
                const certNumber = random6Digits;
                return certNumber;
            }
            // 从身份证号获取性别
            function getGender(idNumber){
                if (!idNumber || !/^\d{17}[\dXx]$/.test(idNumber)) return '男';
                var gender = idNumber.substr(16,1);
                if (gender%2 == 0) return '女';
                return "男";
            }
            
            // 从身份证号计算年龄
            function getAgeFromId(idNumber) {
                if (!idNumber || !/^\d{17}[\dXx]$/.test(idNumber)) return '28';
                const birthYear = parseInt(idNumber.substr(6,4));
                const birthMonth = parseInt(idNumber.substr(10,2));
                const birthDay = parseInt(idNumber.substr(12,2));
                
                const today = new Date();
                let age = today.getFullYear() - birthYear;
                
                if (today.getMonth() + 1 < birthMonth || 
                    (today.getMonth() + 1 === birthMonth && today.getDate() < birthDay)) {
                    age--;
                }

                if (!dateStr) return '2025年08月06日';

                return `${year}年${month}月${day}日`;
            }
            
            // 计算有效期：发证日期下一年的前一天
            function calculateExpireDate(dateStr) {
                if (!dateStr) return '2026年08月05日';
                const [year, month, day] = dateStr.split('-').map(Number);
                const certDate = new Date(year, month - 1, day);
                const expireDate = new Date(certDate);
                expireDate.setFullYear(expireDate.getFullYear() + 1);
                expireDate.setDate(expireDate.getDate() - 1);
                const expireYear = expireDate.getFullYear();
                const expireMonth = (expireDate.getMonth() + 1).toString().padStart(2, '0');
                const expireDay = expireDate.getDate().toString().padStart(2, '0');
                return `${expireYear}年${expireMonth}月${expireDay}日`;
            }
